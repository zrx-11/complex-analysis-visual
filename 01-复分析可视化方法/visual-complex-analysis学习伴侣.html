\theta)}+i\\underbrace{\\left(\\theta-\\frac{\\theta^3}{3!}+\\frac{\\theta^5}{5!}-\\cdots\\right)}_{S(\\theta)}.<\/div>\n<p>先确认这两个级数对一切 <span class=\"katex-inline\">\\theta<\/span> 收敛：相邻项之比的绝对值是 <span class=\"katex-inline\">\\frac{\\theta^2}{(2n+1)(2n+2)}<\/span>（对 <span class=\"katex-inline\">C<\/span>）与 <span class=\"katex-inline\">\\frac{\\theta^2}{(2n+2)(2n+3)}<\/span>（对 <span class=\"katex-inline\">S<\/span>），<span class=\"katex-inline\">n\\to\\infty<\/span> 时趋于 0，比值判别法给出&quot;对任何固定的 <span class=\"katex-inline\">\\theta<\/span> 都收敛&quot;。所以 <span class=\"katex-inline\">C,S<\/span> 是正经函数，可以逐项求导。<\/p>\n<p>逐项求导：<\/p>\n<div class=\"katex-block\">C'=-S,\\qquad S'=C.<\/div>\n<p>这是&quot;逐项求导&quot;合法性的结论，前提是级数在任意有界区间上一致收敛——这里不展开证明，只指出它不是想当然的一步。<\/p>\n<p>现在验长度：<\/p>\n<div class=\"katex-block\">(C^2+S^2)'=2CC'+2SS'=2C(-S)+2S(C)=0.<\/div>\n<p>所以 <span class=\"katex-inline\">C^2+S^2<\/span> 是常数。<span class=\"katex-inline\">\\theta=0<\/span> 时 <span class=\"katex-inline\">C=1,S=0<\/span>，常数为 1，故 <span class=\"katex-inline\">|e^{i\\theta}|=1<\/span>。<\/p>\n<p>再验角度。设 <span class=\"katex-inline\">\\Theta(\\theta)<\/span> 是 <span class=\"katex-inline\">e^{i\\theta}<\/span> 的角度，则 <span class=\"katex-inline\">\\tan\\Theta=S/C<\/span>。两边求导：<\/p>\n<div class=\"katex-block\">\\text{左}=\\sec^2\\Theta\\cdot\\Theta'=(1+\\tan^2\\Theta)\\Theta'=\\left(1+\\frac{S^2}{C^2}\\right)\\Theta'=\\frac{\\Theta'}{C^2}.<\/div>\n<div class=\"katex-block\">\\text{右}=\\frac{S'C-SC'}{C^2}=\\frac{C^2+S^2}{C^2}=\\frac{1}{C^2}.<\/div>\n<p>两边相等给出 <span class=\"katex-inline\">\\Theta&#x27;=1<\/span>，于是 <span class=\"katex-inline\">\\Theta=\\theta+\\text{常数}<\/span>。<span class=\"katex-inline\">\\theta=0<\/span> 时角度为 0，故 <span class=\"katex-inline\">\\Theta=\\theta<\/span>。<\/p>\n<h2>第 7 步：两条证明对上了<\/h2>\n<p>第 2–4 步走的是&quot;速度几何&quot;，第 6 步走的是&quot;幂级数代数&quot;。两条路给出同一个函数：都满足 <span class=\"katex-inline\">Z&#x27;=iZ<\/span>、<span class=\"katex-inline\">Z(0)=1<\/span>，而这样的函数唯一（第 5 步）。所以<\/p>\n<div class=\"katex-block\">e^{i\\theta}=\\cos\\theta+i\\sin\\theta.<\/div>\n<h2>数值算例一：<span class=\"katex-inline\">\\theta=\\pi/3<\/span><\/h2>\n<p>真值：<span class=\"katex-inline\">\\cos60°=0.5<\/span>，<span class=\"katex-inline\">\\sin60°\\approx0.8660<\/span>。<\/p>\n<p><span class=\"katex-inline\">C<\/span> 截断到 <span class=\"katex-inline\">\\theta^4<\/span> 项：<span class=\"katex-inline\">1-\\frac{1.0472^2}{2}+\\frac{1.0472^4}{24}=1-0.5483+0.0500=0.5017<\/span>。 <span class=\"katex-inline\">S<\/span> 截断到 <span class=\"katex-inline\">\\theta^3<\/span> 项：<span class=\"katex-inline\">1.0472-\\frac{1.0472^3}{6}=1.0472-0.1914=0.8558<\/span>。<\/p>\n<p>误差约 <span class=\"katex-inline\">0.001<\/span>–<span class=\"katex-inline\">0.002<\/span>。再加一项 <span class=\"katex-inline\">\\theta^6/720<\/span> 到 <span class=\"katex-inline\">C<\/span>：<span class=\"katex-inline\">\\frac{1.0472^6}{720}\\approx0.0018<\/span>，修正后 <span class=\"katex-inline\">0.5035<\/span>，仍在千分位。级数收敛很快，因为阶乘增长远快于幂。<\/p>\n<h2>数值算例二：验证&quot;角度 = 弧长&quot;<\/h2>\n<p>取 <span class=\"katex-inline\">\\theta=1<\/span> 弧度（约 <span class=\"katex-inline\">57.30°<\/span>）。<span class=\"katex-inline\">C(1)=1-\\frac12+\\frac1{24}-\\frac1{720}+\\cdots\\approx0.5403<\/span>，<span class=\"katex-inline\">S(1)=1-\\frac16+\\frac1{120}-\\frac1{5040}\\approx0.8415<\/span>。长度平方 <span class=\"katex-inline\">0.5403^2+0.8415^2=0.2919+0.7081=1.0000<\/span>，角度 <span class=\"katex-inline\">\\arctan(0.8415/0.5403)=\\arctan1.557\\approx57.3°<\/span>。<span class=\"katex-inline\">57.3°<\/span> 正是 1 弧度。弧长与角度数值相等这条，在数字上也对上了。<\/p>\n<h2>反例：把角换成度会怎样<\/h2>\n<p>若定义 <span class=\"katex-inline\">Z(t)=e^{it°}<\/span>（<span class=\"katex-inline\">t<\/span> 以度为单位），则 <span class=\"katex-inline\">t<\/span> 增加 1，只转了 <span class=\"katex-inline\">\\frac{\\pi}{180}<\/span> 弧度。速度大小变成 <span class=\"katex-inline\">\\frac{\\pi}{180}<\/span> 而不是 1，<span class=\"katex-inline\">Z&#x27;=iZ<\/span> 不再成立，而是 <span class=\"katex-inline\">Z&#x27;=i\\frac{\\pi}{180}Z<\/span>。整条&quot;单位速度、弧长等于角&quot;的推导全部要改。所以欧拉公式里的 <span class=\"katex-inline\">\\theta<\/span> 必须是弧度——不是书写习惯，是导数性质的要求。<\/p>\n<h2>与后面章节的连接<\/h2>\n<ul><li>\n第 2 章：<span class=\"katex-inline\">e^z<\/span> 的周期 <span class=\"katex-inline\">2\\pi i<\/span> 直接来自&quot;角度加 <span class=\"katex-inline\">2\\pi<\/span> 回到同一点&quot;。\n<\/li><li>\n第 4 章：<span class=\"katex-inline\">e^z<\/span> 的导数是它自己，所以它是保角映射的典型例子。\n<\/li><li>\n第 9 章：<span class=\"katex-inline\">e^{i\\theta}<\/span> 沿着单位圆积分一圈得 <span class=\"katex-inline\">2\\pi i<\/span>，是留数定理的原型。\n<\/li><li>\n第 12 章：<span class=\"katex-inline\">e^{in\\theta}<\/span> 构成傅里叶级数的基，&quot;绕圈速度&quot;就是频率。\n<\/ul>\n<h2>差生通读自查<\/h2>\n<ul><li>\n四个前置逐条给了白话；<span class=\"katex-inline\">\\Theta<\/span>、<span class=\"katex-inline\">C<\/span>、<span class=\"katex-inline\">S<\/span>、<span class=\"katex-inline\">Z<\/span>、<span class=\"katex-inline\">V<\/span> 第一次出现都说清了是什么。\n<\/li><li>\n第 3 步的共轭变号、第 6 步的逐项求导都单独交代了&quot;为什么可以这样做&quot;，没有跳步。\n<\/li><li>\n给了&quot;为什么这样设计&quot;：用导数定义 <span class=\"katex-inline\">e^{it}<\/span> 是为了避免循环论证；用弧度是为了让速度等于 1。\n<\/li><li>\n两个数值算例都能手算复核，其中一个专门验&quot;弧长 = 角度&quot;。\n<\/ul><\/div><\/details>", "c04": "<div class=\"source-badge\">📖 出处：复分析：可视化方法（中译本） · p.22<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">欧拉公式<\/a><\/span><\/div><h1>单位根与因式分解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、7 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">n<\/span> 次单位根是方程 <span class=\"katex-inline\">z^n=1<\/span> 的全部解，共 <span class=\"katex-inline\">n<\/span> 个，均匀落在单位圆上，正好是内接正 <span class=\"katex-inline\">n<\/span> 边形的顶点：<\/p>\n<div class=\"katex-block\">z_k=e^{ik\\frac{2\\pi}{n}},\\quad k=0,1,\\dots,n-1.<\/div>\n<h2>为什么重要<\/h2>\n<p>它把&quot;解方程&quot;换成&quot;画正多边形&quot;，同时给出 <span class=\"katex-inline\">z^n-1<\/span> 的完整因式分解。教材 1.3.5 节借这段内容讲了两件事：代数基本定理为什么可信（第 7 章正式证），以及为什么实系数多项式的复根必然成对共轭、从而总能拆成实一次与实二次因式。第 7 章讲环绕数时，单位根又会作为&quot;绕原点转一圈&quot;的最简模型出现。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;z^n = 1&quot;] --&gt; B[&quot;n 个根&lt;br/&gt;e^(ik2π/n)&quot;]\n    B --&gt; C[&quot;单位圆上等角分布&quot;]\n    C --&gt; D[&quot;正 n 边形顶点&quot;]\n    D --&gt; E[&quot;z^n-1 = ∏(z - C_k)&quot;]\n    E --&gt; F[&quot;共轭配对&quot;]\n    F --&gt; G[&quot;实二次因式&lt;br/&gt;z² - 2zcos(2kπ/n) + 1&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：图的顺序就是推理顺序。先有&quot;解在圆上等角分布&quot;这个几何事实，才有因式分解；共轭配对只是这个几何事实的代数翻译（正多边形关于实轴对称）。<\/p>\n<h2>详解<\/h2>\n<h3>根为什么长这样<\/h3>\n<p>设 <span class=\"katex-inline\">z=re^{i\\theta}<\/span>，则 <span class=\"katex-inline\">z^n=r^ne^{in\\theta}<\/span>。要求它等于 <span class=\"katex-inline\">1<\/span>：<\/p>\n<ul><li>\n长度：<span class=\"katex-inline\">r^n=1<\/span>，<span class=\"katex-inline\">r<\/span> 是正实数，所以 <span class=\"katex-inline\">r=1<\/span>；\n<\/li><li>\n角度：<span class=\"katex-inline\">n\\theta<\/span> 必须是 <span class=\"katex-inline\">2\\pi<\/span> 的整数倍，所以 <span class=\"katex-inline\">\\theta=\\frac{2k\\pi}{n}<\/span>。\n<\/ul>\n<p><span class=\"katex-inline\">k<\/span> 取 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">n-1<\/span> 就得到 <span class=\"katex-inline\">n<\/span> 个不同的点，<span class=\"katex-inline\">k<\/span> 再大就开始重复（转整圈回到原处）。<\/p>\n<h3>因式分解<\/h3>\n<p>笛卡儿因式定理说：<span class=\"katex-inline\">c<\/span> 是 <span class=\"katex-inline\">P_n(z)=0<\/span> 的根，则 <span class=\"katex-inline\">P_n(z)=(z-c)P_{n-1}(z)<\/span>。对 <span class=\"katex-inline\">z^n-1<\/span> 反复用 <span class=\"katex-inline\">n<\/span> 次，得<\/p>\n<div class=\"katex-block\">z^n-1=(z-C_1)(z-C_2)\\cdots(z-C_n).<\/div>\n<p><span class=\"katex-inline\">C_k=e^{ik2\\pi/n}<\/span> 与 <span class=\"katex-inline\">C_{n-k}=e^{-ik2\\pi/n}<\/span> 互为共轭（正多边形关于实轴对称），把它们配成一对：<\/p>\n<div class=\"katex-block\">(z-C_k)(z-\\overline{C_k})=z^2-(C_k+\\overline{C_k})z+C_k\\overline{C_k}=z^2-2z\\cos\\frac{2k\\pi}{n}+1.<\/div>\n<p>系数全是实数，这就是&quot;实二次因式&quot;。<span class=\"katex-inline\">k=0<\/span> 与 <span class=\"katex-inline\">k=n/2<\/span>（<span class=\"katex-inline\">n<\/span> 为偶数时）给出实线性因式 <span class=\"katex-inline\">z-1<\/span> 与 <span class=\"katex-inline\">z+1<\/span>。<\/p>\n<h3>科茨的几何版本<\/h3>\n<p>18 世纪的科茨没有复数可用。他的结果：<span class=\"katex-inline\">C_1\\cdots C_n<\/span> 是内接于单位圆的正 <span class=\"katex-inline\">n<\/span> 边形，<span class=\"katex-inline\">P<\/span> 是实轴上距原点为 <span class=\"katex-inline\">x<\/span> 的点，那么<\/p>\n<div class=\"katex-block\">x^n-1=PC_1\\cdot PC_2\\cdots PC_n.<\/div>\n<p>用复数看，<span class=\"katex-inline\">PC_k=|x-C_k|<\/span>，而 <span class=\"katex-inline\">\\prod_k(x-C_k)=x^n-1<\/span> 正是上面的因式分解，取模就得到科茨的等式。教材用这件事说明：复平面的几何不是&quot;人为添加的解释&quot;，它就藏在实代数的结果里。<\/p>\n<h3>一个具体例子：<span class=\"katex-inline\">n=4<\/span><\/h3>\n<p>根是 <span class=\"katex-inline\">1,i,-1,-i<\/span>。因式分解：<\/p>\n<div class=\"katex-block\">z^4-1=(z-1)(z+1)(z-i)(z+i)=(z^2-1)(z^2+1).<\/div>\n<p>两个实二次因式对应两对共轭根。这个例子在教材式 (1.19) 里出现过。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 <span class=\"katex-inline\">z^n=1<\/span> 只有 <span class=\"katex-inline\">z=1<\/span> 一个根——实际上有 <span class=\"katex-inline\">n<\/span> 个，而且都不相同。\n<\/li><li>\n别以为根可以不在单位圆上——实际长度方程 <span class=\"katex-inline\">r^n=1<\/span> 强制 <span class=\"katex-inline\">r=1<\/span>。\n<\/li><li>\n别以为实系数多项式可以随便拆成实一次因式——实际上复根要成对出现，所以拆出来的是实一次加实二次，<span class=\"katex-inline\">x^2+1<\/span> 就是拆不动的例子。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章 1.3.5<\/td><td>科茨的因式分解<\/td><td><span class=\"katex-inline\">x^n-1<\/span> 的根是正 <span class=\"katex-inline\">n<\/span> 边形顶点<\/td><\/tr><tr><td>第 7 章<\/td><td>代数基本定理的几何证明<\/td><td>多项式根的个数与环绕数<\/td><\/tr><tr><td>第 9 章<\/td><td>留数计算<\/td><td>单位根用于算形如 <span class=\"katex-inline\">\\int_0^{2\\pi}<\/span> 的积分<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">欧拉公式<\/a>\n<\/li><li>\n后续：代数基本定理（第 7 章）\n<\/ul>", "c05": "<div class=\"source-badge\">📖 出处：复分析：可视化方法（中译本） · p.24<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c02\">复数乘法：旋转加放大<\/a><\/span><\/div><h1>点乘、叉乘与复数乘法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 1、10、11 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把 <span class=\"katex-inline\">a,b<\/span> 都看成平面向量，则 <span class=\"katex-inline\">\\bar a b<\/span> 是一个复数，它的实部是点乘 <span class=\"katex-inline\">\\mathbf a\\cdot\\mathbf b<\/span>，虚部是由 <span class=\"katex-inline\">\\mathbf a<\/span> 转到 <span class=\"katex-inline\">\\mathbf b<\/span> 的有符号面积（叉乘）：<\/p>\n<div class=\"katex-block\">\\bar a b=\\mathbf a\\cdot\\mathbf b+i(\\mathbf a\\times\\mathbf b).<\/div>\n<h2>为什么重要<\/h2>\n<p>物理里的散度、旋度、通量都用点乘叉乘写；复分析里柯西定理、留数定理又用复数乘法写。这条等式是两套语言的字典：第 10、11 章讲向量场时，全靠它把&quot;流体穿过边界&quot;翻译成&quot;复积分&quot;。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;ā b&quot;] --&gt; B[&quot;实部 = |a||b|cosθ&quot;]\n    A --&gt; C[&quot;虚部 = |a||b|sinθ&quot;]\n    B --&gt; D[&quot;点乘&lt;br/&gt;投影&quot;]\n    C --&gt; E[&quot;叉乘&lt;br/&gt;有符号面积&quot;]\n    D --&gt; F[&quot;散度/通量&quot;]\n    E --&gt; G[&quot;旋度/环绕&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：一个复数乘法同时装了两条几何信息。实部管&quot;投影&quot;，虚部管&quot;扫过的面积&quot;。图里两条分支最后汇到向量场的两个基本运算，这是第 10 章的主线。<\/p>\n<h2>详解<\/h2>\n<h3>为什么是 <span class=\"katex-inline\">\\bar a b<\/span> 而不是 <span class=\"katex-inline\">ab<\/span><\/h3>\n<p>设 <span class=\"katex-inline\">a=|a|e^{i\\alpha}<\/span>，<span class=\"katex-inline\">b=|b|e^{i\\beta}<\/span>。则<\/p>\n<div class=\"katex-block\">\\bar a b=|a|e^{-i\\alpha}|b|e^{i\\beta}=|a||b|e^{i(\\beta-\\alpha)}.<\/div>\n<p>角度是 <span class=\"katex-inline\">\\beta-\\alpha<\/span>，也就是&quot;由 <span class=\"katex-inline\">a<\/span> 转到 <span class=\"katex-inline\">b<\/span>&quot;的角。若用 <span class=\"katex-inline\">ab<\/span>，角度是 <span class=\"katex-inline\">\\alpha+\\beta<\/span>，跟两向量的夹角没关系。所以共轭不能丢。<\/p>\n<h3>坐标形式<\/h3>\n<p><span class=\"katex-inline\">a=x+iy<\/span>，<span class=\"katex-inline\">b=x&#x27;+iy&#x27;<\/span>：<\/p>\n<div class=\"katex-block\">\\bar a b=(x-iy)(x'+iy')=(xx'+yy')+i(xy'-x'y).<\/div>\n<div class=\"katex-block\">\\binom{x}{y}\\cdot\\binom{x'}{y'}=xx'+yy',\\qquad\\binom{x}{y}\\times\\binom{x'}{y'}=xy'-x'y.<\/div>\n<p>后者是带符号的：<span class=\"katex-inline\">a<\/span> 逆时针转到 <span class=\"katex-inline\">b<\/span> 时为正，反之为负。<\/p>\n<h3>多边形面积<\/h3>\n<p>顶点按逆时针为 <span class=\"katex-inline\">a,b,c,d<\/span> 的四边形：<\/p>\n<div class=\"katex-block\">A=\\frac12\\left[(\\mathbf a\\times\\mathbf b)+(\\mathbf b\\times\\mathbf c)+(\\mathbf c\\times\\mathbf d)+(\\mathbf d\\times\\mathbf a)\\right]=\\frac12\\operatorname{Im}(\\bar ab+\\bar bc+\\bar cd+\\bar da).<\/div>\n<p>原点在形外时，某些三角形的有符号面积为负，正好抵消多算的部分。这个&quot;自动抵消&quot;是有符号面积的用处，也是第 8 章讲环绕数的伏笔：绕一圈的积分可以拆成各段的有符号贡献。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为叉乘只存在于三维——实际在平面上它可以定义为有符号面积，这是本书用的版本。\n<\/li><li>\n别把共轭漏掉——<span class=\"katex-inline\">ab<\/span> 的虚部是 <span class=\"katex-inline\">|a||b|\\sin(\\alpha+\\beta)<\/span>，不是面积。\n<\/li><li>\n别以为面积公式要求原点在内部——实际上原点在哪都成立，符号会自动处理。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 1 章 1.3.6<\/td><td>向量运算的复数表示<\/td><td><span class=\"katex-inline\">\\bar ab=\\mathbf a\\cdot\\mathbf b+i(\\mathbf a\\times\\mathbf b)<\/span><\/td><\/tr><tr><td>第 8 章<\/td><td>复积分的几何意义<\/td><td>积分拆成切向与法向分量<\/td><\/tr><tr><td>第 10 章<\/td><td>向量场的散度与旋度<\/td><td>点乘叉乘给出通量与环量<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">复数乘法：旋转加放大<\/a>\n<\/li><li>\n后续：向量场与复积分（第 11 章，待生成）\n<\/ul>", "c06": "<div class=\"source-badge\">📖 出处：复分析：可视化方法（中译本） · p.46<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c01\">复数与复平面<\/a><\/span><\/div><h1>复函数：两个平面之间的搬运<\/h1>\n<ul><li>\n<strong>难度<\/strong>：基础 | <strong>涉及章节<\/strong>：第 2、3、4、10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>复函数 <span class=\"katex-inline\">w=f(z)<\/span> 是一条规则，把 <span class=\"katex-inline\">z<\/span> 平面上的点搬到 <span class=\"katex-inline\">w<\/span> 平面上的点；研究它就是研究这张&quot;搬运地图&quot;把网格、射线、圆搬成了什么。<\/p>\n<h2>为什么重要<\/h2>\n<p>从第 2 章起，全书不再把函数看成公式，而看成几何变换。第 3 章的默比乌斯变换、第 4 章的导数（局部搬运）、第 10 章的向量场，都是这个视角的延伸。教材 p.46 开篇就把它定为全书的基本方法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;z 平面&lt;br/&gt;x + iy&quot;] --&gt; B[&quot;f&quot;]\n    B --&gt; C[&quot;w 平面&lt;br/&gt;u + iv&quot;]\n    A --&gt; D[&quot;极坐标 r∠θ&quot;]\n    D --&gt; C2[&quot;R∠φ&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：左边是输入平面，右边是输出平面。中间只有一个规则，没有&quot;曲线&quot;。两种坐标对应两种读法：笛卡儿看网格，极坐标看长度与角度。<\/p>\n<h2>详解<\/h2>\n<p><span class=\"katex-inline\">z=x+iy<\/span>，<span class=\"katex-inline\">w=u+iv<\/span>，于是 <span class=\"katex-inline\">f<\/span> 可以写成两个实函数：<\/p>\n<div class=\"katex-block\">u=u(x,y),\\qquad v=v(x,y).<\/div>\n<p>换成极坐标 <span class=\"katex-inline\">z=re^{i\\theta}<\/span>、<span class=\"katex-inline\">w=Re^{i\\varphi}<\/span>，则<\/p>\n<div class=\"katex-block\">R=R(r,\\theta),\\qquad \\varphi=\\varphi(r,\\theta).<\/div>\n<p>教材的例子 <span class=\"katex-inline\">f(z)=(1+i\\sqrt3)z<\/span>：极坐标下 <span class=\"katex-inline\">R=2r<\/span>、<span class=\"katex-inline\">\\varphi=\\theta+\\pi/3<\/span>；笛卡儿下 <span class=\"katex-inline\">u=x-\\sqrt3y<\/span>、<span class=\"katex-inline\">v=\\sqrt3x+y<\/span>。两种写法描述同一件事，只是前者一眼看出&quot;放大 2 倍、转 60°&quot;。<\/p>\n<p><strong>可视化方式<\/strong>（教材 2.1）：映射效果、模曲面 <span class=\"katex-inline\">|f(z)|<\/span>、黎曼曲面。本书主用第一种；模曲面适合看&quot;哪里大哪里小&quot;，黎曼曲面适合理解多值函数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为复函数需要四维图像才能研究——实际上看它搬图形的效果就够了。\n<\/li><li>\n别以为 <span class=\"katex-inline\">u,v<\/span> 与 <span class=\"katex-inline\">x,y<\/span> 无关——实际上它们通过 <span class=\"katex-inline\">f<\/span> 耦合，<span class=\"katex-inline\">u<\/span> 通常同时依赖 <span class=\"katex-inline\">x<\/span> 和 <span class=\"katex-inline\">y<\/span>。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>建立映射视角<\/td><td><span class=\"katex-inline\">f<\/span> 是平面到平面的变换<\/td><\/tr><tr><td>第 3 章<\/td><td>默比乌斯变换<\/td><td>圆映成圆的分式线性映射<\/td><\/tr><tr><td>第 4 章<\/td><td>导数<\/td><td>局部看，<span class=\"katex-inline\">f<\/span> 是旋转加放大<\/td><\/tr><tr><td>第 10 章<\/td><td>向量场<\/td><td><span class=\"katex-inline\">f(z)<\/span> 作为从 <span class=\"katex-inline\">z<\/span> 出发的向量<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">复数与复平面<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">幂级数与收敛圆<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">指数映射<\/a>\n<\/ul>", "c07": "<div class=\"source-badge\">📖 出处：复分析：可视化方法（中译本） · p.56<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c06\">复函数：两个平面之间的搬运<\/a><\/span><\/div><h1>幂级数与收敛圆<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2、5、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>幂级数 <span class=\"katex-inline\">P(z)=c_0+c_1z+c_2z^2+\\cdots<\/span> 的收敛区域一定是一个以原点为心的圆盘；盘内绝对收敛，盘外发散，圆周上逐点单独判断。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是第 5 章&quot;解析函数能展成幂级数&quot;和第 9 章&quot;留数计算&quot;的基础。收敛圆还给出一个几何信息：圆周边界上至少有一个奇点，这个奇点的位置决定了半径。教材 2.3 节把&quot;为什么是圆&quot;证得很干净。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;|z| &lt; ρ&quot;] --&gt; B[&quot;绝对收敛&quot;]\n    A2[&quot;|z| = ρ&quot;] --&gt; C[&quot;逐点判断&lt;br/&gt;至少一个奇点&quot;]\n    A3[&quot;|z| &gt; ρ&quot;] --&gt; D[&quot;发散&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：同心圆把平面分成三圈。内圈安全，外圈必坏，中间那圈是边界，需要逐点验。<\/p>\n<h2>详解<\/h2>\n<h3>收敛的定义<\/h3>\n<p>部分和 <span class=\"katex-inline\">P_n(z)=c_0+\\cdots+c_nz^n<\/span>。若 <span class=\"katex-inline\">P_n(a)<\/span> 与某点 <span class=\"katex-inline\">A<\/span> 的距离可以任意小（<span class=\"katex-inline\">n<\/span> 足够大后），就说级数在 <span class=\"katex-inline\">a<\/span> 收敛于 <span class=\"katex-inline\">A<\/span>。<\/p>\n<h3>绝对收敛更强<\/h3>\n<p>若 <span class=\"katex-inline\">\\sum|c_jz^j|<\/span> 收敛，则 <span class=\"katex-inline\">\\sum c_jz^j<\/span> 必收敛。证明只用三角不等式：<span class=\"katex-inline\">|P_n-P_m|\\le\\sum_{j=m+1}^n|c_ja^j|<\/span>。教材式 (2.7)。<\/p>\n<h3>为什么收敛域是圆<\/h3>\n<p>核心一步（式 2.8）：若在 <span class=\"katex-inline\">a\\ne0<\/span> 处收敛，则对任何 <span class=\"katex-inline\">|z|&lt;|a|<\/span> 都收敛。因为<\/p>\n<div class=\"katex-block\">\\left|\\frac{z}{a}\\right|=k<1,<\/div>\n<p>于是 <span class=\"katex-inline\">|c_jz^j|=|c_ja^j|k^j<\/span>，每一项都被&quot;缩&quot;了一个几何级数因子。既然 <span class=\"katex-inline\">\\sum c_ja^j<\/span> 的部分和有界，<span class=\"katex-inline\">k^j<\/span> 又衰减，<span class=\"katex-inline\">\\sum|c_jz^j|<\/span> 收敛。模比 <span class=\"katex-inline\">a<\/span> 小的所有点一起被拿下，收敛域就只能是一圈圈同心圆。<\/p>\n<h3>半径怎么算<\/h3>\n<div class=\"katex-block\">\\rho=\\lim_{n\\to\\infty}\\left|\\frac{c_n}{c_{n+1}}\\right|<\/div>\n<p>（极限存在时），或 <span class=\"katex-inline\">\\rho=1/\\limsup\\sqrt[n]{|c_n|}<\/span>。例：<span class=\"katex-inline\">\\frac{1}{1-z}=1+z+z^2+\\cdots<\/span> 的系数全为 1，<span class=\"katex-inline\">\\rho=1<\/span>；<span class=\"katex-inline\">e^z<\/span> 的系数 <span class=\"katex-inline\">1/n!<\/span>，比值 <span class=\"katex-inline\">\\to\\infty<\/span>，<span class=\"katex-inline\">\\rho=\\infty<\/span>。<\/p>\n<h3>边界上的奇点<\/h3>\n<p>若圆周 <span class=\"katex-inline\">|z|=\\rho<\/span> 上处处收敛，用同样的比较论证可以把半径再推大一点，矛盾。所以边界上至少有一点让级数失效，那一点就是函数的奇点。<span class=\"katex-inline\">\\frac{1}{1-z}<\/span> 的奇点在 <span class=\"katex-inline\">z=1<\/span>，正好在收敛圆上。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为收敛域可以是方形或带形——实际上以原点为中心的幂级数只能是圆盘。\n<\/li><li>\n别以为圆周上一定发散——实际上可以有点收敛、有点发散，例如 <span class=\"katex-inline\">\\sum z^n/n<\/span> 在 <span class=\"katex-inline\">z=-1<\/span> 收敛、<span class=\"katex-inline\">z=1<\/span> 发散。\n<\/li><li>\n别以为绝对收敛和收敛是一回事——实际上绝对收敛更强。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>幂级数的几何<\/td><td>收敛圆盘、边界奇点<\/td><\/tr><tr><td>第 5 章<\/td><td>解析函数的级数<\/td><td>圆内可展成幂级数<\/td><\/tr><tr><td>第 9 章<\/td><td>留数与展开<\/td><td>收敛半径决定展开范围<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">复函数：两个平面之间的搬运<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">指数映射<\/a>\n<\/li><li>\n深度推导：见本页底部折叠片段\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（幂级数与收敛圆）<\/summary><div class=\"depth-body\"><h1>深度推导：为什么幂级数的收敛域一定是一个圆<\/h1>\n<p>前置清单：<\/p>\n<ol><li>\n<strong>绝对值就是到原点的距离<\/strong>：<span class=\"katex-inline\">|z|=\\sqrt{x^2+y^2}<\/span>。\n<\/li><li>\n<strong>三角不等式<\/strong>：<span class=\"katex-inline\">|a+b|\\le|a|+|b|<\/span>，两边之和大于第三边。\n<\/li><li>\n<strong>等比级数<\/strong>：<span class=\"katex-inline\">k&lt;1<\/span> 时 <span class=\"katex-inline\">1+k+k^2+\\cdots=\\frac{1}{1-k}<\/span>，部分和有上界。\n<\/li><li>\n<strong>收敛的意思<\/strong>：部分和 <span class=\"katex-inline\">P_n<\/span> 与某个数 <span class=\"katex-inline\">A<\/span> 的距离，只要 <span class=\"katex-inline\">n<\/span> 足够大就能任意小（<span class=\"katex-inline\">\\varepsilon<\/span>–<span class=\"katex-inline\">N<\/span> 语言）。\n<\/ol>\n<h2>第 0 步：要证的三件事<\/h2>\n<ol><li>\n若级数在 <span class=\"katex-inline\">a\\ne0<\/span> 收敛，则对所有 <span class=\"katex-inline\">|z|&lt;|a|<\/span> 都<strong>绝对收敛<\/strong>。\n<\/li><li>\n由此，收敛点集合&quot;向内封闭&quot;：能收敛的地方，比它更靠近原点的点也收敛。\n<\/li><li>\n这个集合因此只能是一个圆盘（可能半径 0 或无穷）。\n<\/ol>\n<h2>第 1 步：把&quot;收敛&quot;翻译成一条可用的不等式<\/h2>\n<p><span class=\"katex-inline\">P_n(a)<\/span> 越来越靠近 <span class=\"katex-inline\">A<\/span>，意味着它们彼此之间也越来越靠近：存在常数 <span class=\"katex-inline\">M<\/span>，使对所有 <span class=\"katex-inline\">n<\/span><\/p>\n<div class=\"katex-block\">|c_na^n|=|P_n(a)-P_{n-1}(a)|\\le M.<\/div>\n<p>为什么？两项都离 <span class=\"katex-inline\">A<\/span> 不超过某个小量 <span class=\"katex-inline\">\\varepsilon<\/span>，它们的差就不超过 <span class=\"katex-inline\">2\\varepsilon<\/span>（三角不等式：<span class=\"katex-inline\">|P_n-A+A-P_{n-1}|\\le|P_n-A|+|A-P_{n-1}|<\/span>）。<span class=\"katex-inline\">M<\/span> 的具体数值不重要，只要&quot;有一个统一的界&quot;。<\/p>\n<p>这一步是整条证明的支点：<strong>收敛给的不是&quot;项趋于零&quot;，而是&quot;项有一个与 <span class=\"katex-inline\">n<\/span> 无关的上界&quot;<\/strong>。<\/p>\n<h2>第 2 步：用 <span class=\"katex-inline\">a<\/span> 的项去控制 <span class=\"katex-inline\">z<\/span> 的项<\/h2>\n<p>设 <span class=\"katex-inline\">k=\\left|\\frac{z}{a}\\right|<\/span>。因为 <span class=\"katex-inline\">|z|&lt;|a|<\/span>，所以 <span class=\"katex-inline\">0\\le k&lt;1<\/span>。对每一项：<\/p>\n<div class=\"katex-block\">|c_jz^j|=\\left|c_ja^j\\right|\\cdot\\left|\\frac{z}{a}\\right|^j\\le M\\,k^j.<\/div>\n<p>第一步只是把 <span class=\"katex-inline\">z^j<\/span> 写成 <span class=\"katex-inline\">a^j\\left(\\frac{z}{a}\\right)^j<\/span>，第二步用了第 1 步的界和 <span class=\"katex-inline\">|(z/a)^j|=k^j<\/span>。<\/p>\n<p>关键在 <span class=\"katex-inline\">k&lt;1<\/span>：<span class=\"katex-inline\">z<\/span> 比 <span class=\"katex-inline\">a<\/span> 更靠近原点，它的项被一个严格小于 1 的因子逐次压低。<\/p>\n<h2>第 3 步：与等比级数比较<\/h2>\n<div class=\"katex-block\">\\sum_{j=0}^{\\infty}|c_jz^j|\\le M\\sum_{j=0}^{\\infty}k^j=\\frac{M}{1-k}.<\/div>\n<p>右边是有限的（前置 3）。左边的部分和单调递增且有上界，所以收敛——这就是&quot;绝对收敛&quot;的定义。于是第 1 条结论成立。<\/p>\n<h2>第 4 步：绝对收敛推出普通收敛<\/h2>\n<p>对任意 <span class=\"katex-inline\">n&gt;m<\/span>：<\/p>\n<div class=\"katex-block\">|P_n(z)-P_m(z)|=\\left|\\sum_{j=m+1}^{n}c_jz^j\\right|\\le\\sum_{j=m+1}^{n}|c_jz^j|.<\/div>\n<p>右边是绝对收敛级数的一段尾巴，<span class=\"katex-inline\">m<\/span> 足够大时可以任意小；所以左边也可以任意小。部分和序列是柯西序列，因而收敛（实分析的基本定理：柯西序列收敛）。<\/p>\n<p>这条不等式还说明一件事：<strong>绝对收敛比普通收敛强<\/strong>，因为它控制了&quot;走弯路的总长度&quot;，而不只是&quot;终点离得多近&quot;。<\/p>\n<h2>第 5 步：收敛点集合为什么是圆盘<\/h2>\n<p>设<\/p>\n<div class=\"katex-block\">\\rho=\\sup\\{|z|:P(z)\\text{ 收敛}\\}.<\/div>\n<ul><li>\n若 <span class=\"katex-inline\">|z_0|&lt;\\rho<\/span>：由 <span class=\"katex-inline\">\\rho<\/span> 的定义，存在一个收敛点 <span class=\"katex-inline\">a<\/span> 使 <span class=\"katex-inline\">|z_0|&lt;|a|<\/span>（否则 <span class=\"katex-inline\">\\rho<\/span> 可以取更小）。由第 1–3 步，<span class=\"katex-inline\">z_0<\/span> 绝对收敛。\n<\/li><li>\n若 <span class=\"katex-inline\">|z_0|&gt;\\rho<\/span>：若它收敛，<span class=\"katex-inline\">\\rho<\/span> 至少应等于 <span class=\"katex-inline\">|z_0|<\/span>，矛盾，故发散。\n<\/li><li>\n若 <span class=\"katex-inline\">|z_0|=\\rho<\/span>：上面的比较论证要求 <span class=\"katex-inline\">|z_0|&lt;|a|<\/span>，恰好取等号时用不上，只能逐点判断。\n<\/ul>\n<p>换个说法：每个收敛点 <span class=\"katex-inline\">a<\/span> 都&quot;带来&quot;整个圆盘 <span class=\"katex-inline\">|z|&lt;|a|<\/span>。把所有这样的圆盘并起来，得到的是以原点为心、半径取到上确界的那个圆盘——<strong>圆盘是&quot;以原点为心的圆盘族之并&quot;的唯一形状<\/strong>。这就是收敛域不能是方形、带形或别的形状的原因。<\/p>\n<h2>第 6 步：半径怎么算（比值判别法）<\/h2>\n<p>若系数满足<\/p>\n<div class=\"katex-block\">\\lim_{n\\to\\infty}\\left|\\frac{c_{n+1}}{c_n}\\right|=L,<\/div>\n<p>则 <span class=\"katex-inline\">\\rho=1/L<\/span>（<span class=\"katex-inline\">L=0<\/span> 时 <span class=\"katex-inline\">\\rho=\\infty<\/span>，<span class=\"katex-inline\">L=\\infty<\/span> 时 <span class=\"katex-inline\">\\rho=0<\/span>）。<\/p>\n<p>证明思路：比值条件意味着，当 <span class=\"katex-inline\">n<\/span> 很大时<\/p>\n<div class=\"katex-block\">\\left|\\frac{c_{n+1}z^{n+1}}{c_nz^n}\\right|\\approx L|z|.<\/div>\n<p>若 <span class=\"katex-inline\">L|z|&lt;1<\/span>，从某一项起，后一项比前一项小一个固定比例 <span class=\"katex-inline\">q&lt;1<\/span>，于是通项被 <span class=\"katex-inline\">Cq^n<\/span> 控制，级数绝对收敛。若 <span class=\"katex-inline\">L|z|&gt;1<\/span>，后一项比前一项大，通项不趋于零，级数发散。两种情况的临界点正是 <span class=\"katex-inline\">|z|=1/L<\/span>。<\/p>\n<p>另一种写法是 Cauchy–Hadamard：<span class=\"katex-inline\">\\rho=1/\\limsup_n\\sqrt[n]{|c_n|}<\/span>，对没有比值的系数也成立。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">\\sum z^n/2^n<\/span><\/h2>\n<p>系数 <span class=\"katex-inline\">c_n=2^{-n}<\/span>，比值 <span class=\"katex-inline\">=\\frac12<\/span>，半径 <span class=\"katex-inline\">\\rho=2<\/span>。在 <span class=\"katex-inline\">|z|&lt;2<\/span> 内收敛到 <span class=\"katex-inline\">\\frac{1}{1-z/2}=\\frac{2}{2-z}<\/span>；<span class=\"katex-inline\">z=2<\/span> 时通项为 1，不趋于零，发散；<span class=\"katex-inline\">z=-2<\/span> 时通项为 <span class=\"katex-inline\">(-1)^n<\/span>，也不趋于零，发散。边界两点都坏，符合&quot;边界至少有奇点&quot;——奇点就在 <span class=\"katex-inline\">z=2<\/span>。<\/p>\n<h2>数值算例二：<span class=\"katex-inline\">\\sum z^n/n<\/span><\/h2>\n<p>系数 <span class=\"katex-inline\">c_n=1/n<\/span>，比值 <span class=\"katex-inline\">\\frac{n}{n+1}\\to1<\/span>，半径 <span class=\"katex-inline\">\\rho=1<\/span>。<\/p>\n<p>边界上：<\/p>\n<ul><li>\n<span class=\"katex-inline\">z=1<\/span>：级数变成调和级数 <span class=\"katex-inline\">1+\\frac12+\\frac13+\\cdots<\/span>，发散（部分和按 <span class=\"katex-inline\">\\ln n<\/span> 增长）。\n<\/li><li>\n<span class=\"katex-inline\">z=-1<\/span>：交错调和级数 <span class=\"katex-inline\">1-\\frac12+\\frac13-\\cdots<\/span>，收敛（通项递减趋于零）。\n<\/ul>\n<p>同一个收敛圆上，一个点收敛、一个点发散。这正说明&quot;圆周上逐点判断&quot;不是客套话。<\/p>\n<h2>反例：在 <span class=\"katex-inline\">a<\/span> 收敛不能推出&quot;同样模长的点都收敛&quot;<\/h2>\n<p>取上面的 <span class=\"katex-inline\">\\sum z^n/n<\/span>，<span class=\"katex-inline\">a=-1<\/span> 收敛；同模长的 <span class=\"katex-inline\">z=1<\/span> 发散。所以收敛性依赖的不只是长度，还依赖方向。圆盘内部的结论（<span class=\"katex-inline\">|z|&lt;|a|<\/span>）之所以成立，是因为它比 <span class=\"katex-inline\">a<\/span> <strong>严格更靠近原点<\/strong>，而不是因为模长相同。<\/p>\n<h2>与后面章节的连接<\/h2>\n<ul><li>\n第 5 章：解析函数在圆内可以展开成幂级数，收敛半径由最近的奇点决定。你现在证的&quot;边界必有奇点&quot;就是那条定理的几何一半。\n<\/li><li>\n第 9 章：算留数要在一个圆环里展开，圆环的内外半径就是两个奇点的距离。\n<\/li><li>\n第 3 章：默比乌斯变换把圆盘映成圆盘或半平面，收敛圆的形状在变换下保持&quot;圆&quot;这一族。\n<\/ul>\n<h2>差生通读自查<\/h2>\n<ul><li>\n四个前置逐条给了白话；<span class=\"katex-inline\">\\varepsilon<\/span>、<span class=\"katex-inline\">M<\/span>、<span class=\"katex-inline\">k<\/span>、<span class=\"katex-inline\">\\rho<\/span> 第一次出现都解释了含义。\n<\/li><li>\n&quot;为什么 <span class=\"katex-inline\">|c_na^n|<\/span> 有界&quot;这一步最容易跳，文中用三角不等式单独补了一行。\n<\/li><li>\n给了&quot;为什么是圆&quot;：不是规定，而是&quot;每个收敛点带来一个圆盘&quot;逼出来的。\n<\/li><li>\n两个数值算例分别验了&quot;边界全坏&quot;和&quot;边界一点收敛一点发散&quot;，没有只给结论。\n<\/ul><\/div><\/details>", "c08": "<div class=\"source-badge\">📖 出处：复分析：可视化方法（中译本） · p.68<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c03\">欧拉公式<\/a><\/span> · <span class=\"prereq-soft\"><span class=\"prereq-tag\">荐<\/span> <a href=\"#/concept/c07\">幂级数与收敛圆<\/a><\/span><\/div><h1>指数映射 <span class=\"katex-inline\">e^z<\/span><\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 2、5、9、12 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p><span class=\"katex-inline\">e^z<\/span> 把 <span class=\"katex-inline\">z=x+iy<\/span> 送到 <span class=\"katex-inline\">e^x e^{iy}<\/span>：横坐标管长度（指数放大），纵坐标管角度（绕圆旋转），因此它把一条条水平带卷成整个平面。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是复分析里最重要的映射：周期 <span class=\"katex-inline\">2\\pi i<\/span> 说明它非一对一，直接导致对数多值；虚轴映成单位圆，把&quot;角度&quot;和&quot;旋转&quot;绑在一起；第 12 章讲调和函数时，<span class=\"katex-inline\">e^{in\\theta}<\/span> 又是傅里叶基。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;水平带 0 ≤ y &lt; 2π&quot;] --&gt; B[&quot;整个 w 平面&lt;br/&gt;去掉 0&quot;]\n    C[&quot;水平线 y = 常数&quot;] --&gt; D[&quot;从原点出发的射线&quot;]\n    E[&quot;竖直线 x = 常数&quot;] --&gt; F[&quot;以原点为心的圆&quot;]\n    G[&quot;虚轴 x = 0&quot;] --&gt; H[&quot;单位圆&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：横平竖直的网格被&quot;卷&quot;成极坐标网格。水平线变成射线，竖直线变成圆，虚轴正好是单位圆。<\/p>\n<h2>详解<\/h2>\n<h3>代数性质<\/h3>\n<div class=\"katex-block\">e^{z_1+z_2}=e^{z_1}e^{z_2},\\qquad e^{x+iy}=e^xe^{iy}.<\/div>\n<p>第二条是第一条加欧拉公式的直接结果。于是 <span class=\"katex-inline\">|e^z|=e^x<\/span>，<span class=\"katex-inline\">\\arg e^z=y<\/span>（差 <span class=\"katex-inline\">2\\pi<\/span> 整数倍）。<\/p>\n<h3>三条几何事实<\/h3>\n<ol><li>\n<strong>周期 <span class=\"katex-inline\">2\\pi i<\/span><\/strong>：<span class=\"katex-inline\">e^{z+2\\pi i}=e^z<\/span>。<span class=\"katex-inline\">z<\/span> 往上挪 <span class=\"katex-inline\">2\\pi<\/span>，<span class=\"katex-inline\">w<\/span> 绕原点转一圈回原处。\n<\/li><li>\n<strong>水平带铺满全平面<\/strong>：固定 <span class=\"katex-inline\">- \\pi&lt;y\\le\\pi<\/span>，<span class=\"katex-inline\">x<\/span> 从 <span class=\"katex-inline\">-\\infty<\/span> 到 <span class=\"katex-inline\">+\\infty<\/span>，<span class=\"katex-inline\">|w|=e^x<\/span> 从 <span class=\"katex-inline\">0<\/span> 到 <span class=\"katex-inline\">\\infty<\/span>，角度扫遍一整圈。所以这条带一对一地铺满 <span class=\"katex-inline\">\\mathbb{C}\\setminus\\{0\\}<\/span>。\n<\/li><li>\n<strong>虚轴缠单位圆<\/strong>：<span class=\"katex-inline\">e^{iy}=\\cos y+i\\sin y<\/span>，<span class=\"katex-inline\">y<\/span> 走多远，点就在单位圆上绕多少圈。\n<\/ol>\n<p>由此还能读出左右半平面的像：<span class=\"katex-inline\">x&lt;0<\/span> 时 <span class=\"katex-inline\">|w|&lt;1<\/span>，落在单位圆内；<span class=\"katex-inline\">x&gt;0<\/span> 时落在圆外。<\/p>\n<h3>另一种定义<\/h3>\n<div class=\"katex-block\">e^z=\\lim_{n\\to\\infty}\\left(1+\\frac{z}{n}\\right)^n.<\/div>\n<p>几何读法：<span class=\"katex-inline\">1+\\frac{z}{n}<\/span> 是长度约 <span class=\"katex-inline\">1+\\frac{x}{n}<\/span>、角度约 <span class=\"katex-inline\">\\frac{y}{n}<\/span> 的复数。自乘 <span class=\"katex-inline\">n<\/span> 次后，长度趋向 <span class=\"katex-inline\">e^x<\/span>（复利公式），角度趋向 <span class=\"katex-inline\">y<\/span>（<span class=\"katex-inline\">n<\/span> 份 <span class=\"katex-inline\">\\frac{y}{n}<\/span> 相加）。教材 2.4.3 用这个定义绕开了&quot;先用级数再用欧拉公式&quot;的循环论证。<\/p>\n<h3>保角预告<\/h3>\n<p>教材图 2-19 最后一条：小正方形的象&quot;非常接近正方形&quot;，两条相交直线的象交角不变。这个性质第 4 章会正式讲，叫<strong>保角<\/strong>（conformal）。<span class=\"katex-inline\">e^z<\/span> 是保角映射的典型代表。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 <span class=\"katex-inline\">e^z<\/span> 单调——实际上它周期重复，同一个值有无穷多个原象。\n<\/li><li>\n别以为 <span class=\"katex-inline\">e^z<\/span> 永远不为零——实际上 <span class=\"katex-inline\">|e^z|=e^x&gt;0<\/span>，<span class=\"katex-inline\">0<\/span> 永远取不到，它是&quot;被挖掉&quot;的点。\n<\/li><li>\n别以为 <span class=\"katex-inline\">e^{z}<\/span> 的实部虚部就是 <span class=\"katex-inline\">e^x\\cos y<\/span> 和 <span class=\"katex-inline\">e^x\\sin y<\/span> 之外的什么东西——实际上正是这两项，<span class=\"katex-inline\">u=e^x\\cos y<\/span>，<span class=\"katex-inline\">v=e^x\\sin y<\/span>。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>指数函数的映射<\/td><td>周期 <span class=\"katex-inline\">2\\pi i<\/span>，带→全平面<\/td><\/tr><tr><td>第 5 章<\/td><td>初等函数的导数<\/td><td><span class=\"katex-inline\">(e^z)&#x27;=e^z<\/span>，仍是自身<\/td><\/tr><tr><td>第 9 章<\/td><td>留数计算<\/td><td><span class=\"katex-inline\">e^{iz}<\/span> 用于实积分<\/td><\/tr><tr><td>第 12 章<\/td><td>调和函数<\/td><td><span class=\"katex-inline\">e^{in\\theta}<\/span> 作为傅里叶基<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">欧拉公式<\/a>、<a href=\"#\" target=\"_blank\" rel=\"noopener\">幂级数与收敛圆<\/a>\n<\/li><li>\n后续：<a href=\"#\" target=\"_blank\" rel=\"noopener\">多值函数与支点<\/a>\n<\/li><li>\n深度推导：见本页底部折叠片段（另一条定义为何等价）\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（指数映射 e^z）<\/summary><div class=\"depth-body\"><h1>深度推导：<span class=\"katex-inline\">\\lim(1+z/n)^n<\/span> 与幂级数给出同一个 <span class=\"katex-inline\">e^z<\/span><\/h1>\n<p>前置清单：<\/p>\n<ol><li>\n<strong>二项式定理<\/strong>：<span class=\"katex-inline\">(1+x)^n=1+nx+\\frac{n(n-1)}{2!}x^2+\\cdots+x^n<\/span>，一般项是 <span class=\"katex-inline\">\\binom{n}{j}x^j<\/span>。\n<\/li><li>\n<strong>实数极限<\/strong>：<span class=\"katex-inline\">\\lim_{n\\to\\infty}(1+x/n)^n=e^x<\/span>。\n<\/li><li>\n<strong>复数乘法<\/strong>：长度相乘、角度相加（第 1 章）。\n<\/li><li>\n<strong>收敛<\/strong>：部分和可以任意接近极限。\n<\/ol>\n<h2>第 0 步：两条定义，要证它们相等<\/h2>\n<ul><li>\n幂级数定义：<span class=\"katex-inline\">E_1(z)=1+z+\\frac{z^2}{2!}+\\frac{z^3}{3!}+\\cdots<\/span>\n<\/li><li>\n极限定义：<span class=\"katex-inline\">E_2(z)=\\lim_{n\\to\\infty}\\left(1+\\frac{z}{n}\\right)^n<\/span>\n<\/ul>\n<p>要证 <span class=\"katex-inline\">E_1(z)=E_2(z)<\/span> 对一切 <span class=\"katex-inline\">z<\/span> 成立。这不是&quot;两个都叫 <span class=\"katex-inline\">e^z<\/span> 所以相等&quot;，得真的把两边接上。<\/p>\n<h2>第 1 步：把 <span class=\"katex-inline\">(1+z/n)^n<\/span> 完全展开<\/h2>\n<div class=\"katex-block\">P_n(z)=\\left(1+\\frac{z}{n}\\right)^n=\\sum_{j=0}^{n}\\binom{n}{j}\\frac{z^j}{n^j}.<\/div>\n<p>二项式系数展开：<\/p>\n<div class=\"katex-block\">\\binom{n}{j}=\\frac{n(n-1)(n-2)\\cdots(n-j+1)}{j!}.<\/div>\n<p>除以 <span class=\"katex-inline\">n^j<\/span>，把每个因子配一个 <span class=\"katex-inline\">n<\/span>：<\/p>\n<div class=\"katex-block\">\\frac{\\binom{n}{j}}{n^j}=\\frac{1}{j!}\\cdot\\frac{n}{n}\\cdot\\frac{n-1}{n}\\cdot\\frac{n-2}{n}\\cdots\\frac{n-j+1}{n}=\\frac{\\left(1-\\frac1n\\right)\\left(1-\\frac2n\\right)\\cdots\\left(1-\\frac{j-1}{n}\\right)}{j!}.<\/div>\n<p>所以<\/p>\n<div class=\"katex-block\">P_n(z)=1+z+\\frac{1-\\frac1n}{2!}z^2+\\frac{\\left(1-\\frac1n\\right)\\left(1-\\frac2n\\right)}{3!}z^3+\\cdots<\/div>\n<p>到第 <span class=\"katex-inline\">n<\/span> 项为止。<\/p>\n<h2>第 2 步：逐项看系数往哪跑<\/h2>\n<p>固定第 <span class=\"katex-inline\">j<\/span> 项。<span class=\"katex-inline\">n\\to\\infty<\/span> 时，每个因子 <span class=\"katex-inline\">\\left(1-\\frac{i}{n}\\right)\\to1<\/span>，所以<\/p>\n<div class=\"katex-block\">\\frac{\\binom{n}{j}}{n^j}\\to\\frac{1}{j!}.<\/div>\n<p>于是对每个固定的 <span class=\"katex-inline\">j<\/span>，<span class=\"katex-inline\">P_n(z)<\/span> 的第 <span class=\"katex-inline\">j<\/span> 项系数趋向幂级数的第 <span class=\"katex-inline\">j<\/span> 项系数：<\/p>\n<div class=\"katex-block\">P_n(z)\\to 1+z+\\frac{z^2}{2!}+\\frac{z^3}{3!}+\\cdots<\/div>\n<p>&quot;逐项收敛&quot;到这里只是<strong>形式上的<\/strong>：一个有无穷多项的级数，不能因为&quot;每一项都对&quot;就断定&quot;整体对&quot;。需要控制尾巴。<\/p>\n<h2>第 3 步：尾巴为什么可控<\/h2>\n<p>两个事实合起来用：<\/p>\n<ul><li>\n<strong>(a) 有界性<\/strong>：对固定的 <span class=\"katex-inline\">|z|\\le R<\/span>，<span class=\"katex-inline\">\\left|1+\\frac{z}{n}\\right|^n\\le\\left(1+\\frac{R}{n}\\right)^n\\le e^{R}<\/span>。所以 <span class=\"katex-inline\">P_n(z)<\/span> 的所有值落在一个固定圆盘里，不会&quot;跑到无穷远&quot;。\n<\/li><li>\n<strong>(b) 尾巴小<\/strong>：<span class=\"katex-inline\">P_n(z)<\/span> 与它的截断幂级数只差两类东西——一是系数从 <span class=\"katex-inline\">\\frac1{j!}<\/span> 变成带 <span class=\"katex-inline\">\\left(1-\\frac{i}{n}\\right)<\/span> 的乘积，二是第 <span class=\"katex-inline\">n<\/span> 项之后幂级数还有尾巴。这两类误差都可以用 <span class=\"katex-inline\">\\sum_{j&gt;N}\\frac{R^j}{j!}<\/span> 控制，而后者是收敛级数的尾巴，<span class=\"katex-inline\">N<\/span> 足够大时可以任意小。\n<\/ul>\n<p>严格写法要用&quot;在紧集上一致收敛&quot;这条定理（教材没有展开，只说了欧拉当年也把它当显然）。对零基础读者，这里的正确态度是：<strong>承认这一步需要一个定理，但先用数字确认它不是空话<\/strong>（见下面算例）。<\/p>\n<h2>第 4 步：几何读法——为什么极限是&quot;长度 <span class=\"katex-inline\">e^x<\/span>、角度 <span class=\"katex-inline\">y<\/span>&quot;<\/h2>\n<p>设 <span class=\"katex-inline\">z=x+iy<\/span>，把它切成 <span class=\"katex-inline\">n<\/span> 份，每份是<\/p>\n<div class=\"katex-block\">\\varepsilon=\\frac{x}{n}+i\\frac{y}{n}.<\/div>\n<p>对很小的 <span class=\"katex-inline\">\\varepsilon<\/span>，<span class=\"katex-inline\">1+\\varepsilon<\/span> 的长度和角度可以读出：<\/p>\n<ul><li>\n长度：<span class=\"katex-inline\">\\left|1+\\varepsilon\\right|\\approx1+\\frac{x}{n}<\/span>（因为 <span class=\"katex-inline\">\\varepsilon<\/span> 的实部是 <span class=\"katex-inline\">x/n<\/span>，虚部对长度的影响是二阶小量 <span class=\"katex-inline\">\\frac{y^2}{2n^2}<\/span>）。\n<\/li><li>\n角度：<span class=\"katex-inline\">\\arg(1+\\varepsilon)\\approx\\frac{y/n}{1}=\\frac{y}{n}<\/span>（小角度近似 <span class=\"katex-inline\">\\tan\\alpha\\approx\\alpha<\/span>）。\n<\/ul>\n<p>把 <span class=\"katex-inline\">1+\\varepsilon<\/span> 自乘 <span class=\"katex-inline\">n<\/span> 次：<\/p>\n<ul><li>\n长度：<span class=\"katex-inline\">\\left(1+\\frac{x}{n}\\right)^n\\to e^x<\/span>（复利公式）。\n<\/li><li>\n角度：<span class=\"katex-inline\">\\frac{y}{n}<\/span> 加 <span class=\"katex-inline\">n<\/span> 次，得 <span class=\"katex-inline\">y<\/span>。\n<\/ul>\n<p>所以极限是长度为 <span class=\"katex-inline\">e^x<\/span>、角度为 <span class=\"katex-inline\">y<\/span> 的复数，也就是 <span class=\"katex-inline\">e^xe^{iy}<\/span>。这跟第 1 章的欧拉公式合起来，正是 <span class=\"katex-inline\">e^{x+iy}=e^xe^{iy}<\/span>。<\/p>\n<p><strong>这一步给了 <span class=\"katex-inline\">e^z<\/span> 的&quot;为什么这样设计&quot;<\/strong>：指数函数不是随便规定的，它是&quot;把增长切成无穷多份、每份按复利长一点、同时转一点角度&quot;的极限。<\/p>\n<h2>第 5 步：为什么 <span class=\"katex-inline\">e^z<\/span> 周期是 <span class=\"katex-inline\">2\\pi i<\/span><\/h2>\n<p>长度只由 <span class=\"katex-inline\">x<\/span> 决定，角度只由 <span class=\"katex-inline\">y<\/span> 决定。<span class=\"katex-inline\">y<\/span> 增加 <span class=\"katex-inline\">2\\pi<\/span>，角度转一整圈，长度不变，所以值不变：<\/p>\n<div class=\"katex-block\">e^{z+2\\pi i}=e^z.<\/div>\n<p>反过来，<span class=\"katex-inline\">x\\to-\\infty<\/span> 时长度 <span class=\"katex-inline\">e^x\\to0<\/span>，所以 <span class=\"katex-inline\">0<\/span> 永远取不到。这两条几何事实都是第 4 步的直接推论，不需要再单独记。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">z=i\\pi/2<\/span>，看 <span class=\"katex-inline\">n<\/span> 变大时怎么逼近 <span class=\"katex-inline\">i<\/span><\/h2>\n<p>记 <span class=\"katex-inline\">a_n=\\left(1+\\frac{i\\pi/2}{n}\\right)^n<\/span>。<\/p>\n<p><span class=\"katex-inline\">n=10<\/span>：每份 <span class=\"katex-inline\">0.15708i<\/span>。长度 <span class=\"katex-inline\">(1+0.02467)^{5}\\approx1.1297<\/span>（把 <span class=\"katex-inline\">1+0.15708i<\/span> 的长度平方 <span class=\"katex-inline\">1.02467<\/span> 开五次方），角度 <span class=\"katex-inline\">10\\arctan0.15708\\approx10\\times8.93°=89.3°<\/span>。于是<\/p>\n<div class=\"katex-block\">a_{10}\\approx1.1297(\\cos89.3°+i\\sin89.3°)\\approx0.0138+1.1296i.<\/div>\n<p><span class=\"katex-inline\">n=100<\/span>：长度 <span class=\"katex-inline\">\\approx(1.0002467)^{50}\\approx1.0124<\/span>，角度 <span class=\"katex-inline\">\\approx100\\times0.8999°=89.99°<\/span>，<\/p>\n<div class=\"katex-block\">a_{100}\\approx0.0002+1.0124i.<\/div>\n<p><span class=\"katex-inline\">n=1000<\/span>：长度 <span class=\"katex-inline\">\\approx1.0012<\/span>，角度 <span class=\"katex-inline\">\\approx89.999°<\/span>，<span class=\"katex-inline\">a_{1000}\\approx1.0012i<\/span>。<\/p>\n<p>虚部从 <span class=\"katex-inline\">1.13<\/span> 降到 <span class=\"katex-inline\">1.012<\/span> 再到 <span class=\"katex-inline\">1.001<\/span>，实部从 <span class=\"katex-inline\">0.014<\/span> 降到 <span class=\"katex-inline\">0.0002<\/span>。误差大致按 <span class=\"katex-inline\">\\frac{\\pi}{2n}<\/span> 缩小——收敛是慢的，但确实在收敛到 <span class=\"katex-inline\">i<\/span>。<\/p>\n<h2>数值算例二：<span class=\"katex-inline\">z=1<\/span>，与 <span class=\"katex-inline\">e\\approx2.71828<\/span> 比<\/h2>\n<p><span class=\"katex-inline\">a_n=(1+1/n)^n<\/span>：<span class=\"katex-inline\">a_{10}=2.5937<\/span>，<span class=\"katex-inline\">a_{100}=2.7048<\/span>，<span class=\"katex-inline\">a_{1000}=2.7169<\/span>。每加一个零，逼近一位左右。这是复利公式的经典收敛速度，与复数情形同源。<\/p>\n<h2>反例：<span class=\"katex-inline\">\\varepsilon<\/span> 不小时，不能把&quot;角度相加&quot;当精确等式<\/h2>\n<p>有人会直接写&quot;<span class=\"katex-inline\">(1+\\varepsilon)^n<\/span> 的角度 <span class=\"katex-inline\">=n\\arg(1+\\varepsilon)<\/span>&quot;然后令 <span class=\"katex-inline\">n\\to\\infty<\/span>。对小 <span class=\"katex-inline\">\\varepsilon<\/span> 这条近似没问题，但对大的 <span class=\"katex-inline\">\\varepsilon<\/span> 会出错。取 <span class=\"katex-inline\">\\varepsilon=i\\pi/2<\/span>（即 <span class=\"katex-inline\">n=1<\/span>），<span class=\"katex-inline\">\\arg(1+i\\pi/2)\\approx57.5°<\/span>，而 <span class=\"katex-inline\">n\\arg=57.5°<\/span>，并不是 <span class=\"katex-inline\">90°<\/span>——直接套&quot;角度相加&quot;会得到错误结论。教材译者注特别提醒：粗心对待这个&quot;显然&quot;的极限会导出错误。正确做法是先把 <span class=\"katex-inline\">z<\/span> 切成 <span class=\"katex-inline\">n<\/span> 份，让每份 <span class=\"katex-inline\">\\varepsilon=z/n<\/span> 真的趋于 0，再逐份取近似。<\/p>\n<h2>与后面章节的连接<\/h2>\n<ul><li>\n第 2 章：<span class=\"katex-inline\">e^z<\/span> 的映射性质（水平带铺满全平面、虚轴缠单位圆）都是这条极限的几何翻译。\n<\/li><li>\n第 4 章：<span class=\"katex-inline\">(e^z)&#x27;=e^z<\/span> 从幂级数逐项求导直接看出，也是&quot;保角&quot;的典型例子。\n<\/li><li>\n第 9 章：<span class=\"katex-inline\">e^{iz}<\/span> 沿实轴积分可以化成三角函数的积分，靠的正是这里的定义一致性。\n<\/ul>\n<h2>差生通读自查<\/h2>\n<ul><li>\n二项式系数、<span class=\"katex-inline\">\\binom{n}{j}<\/span>、<span class=\"katex-inline\">j!<\/span>、<span class=\"katex-inline\">\\varepsilon<\/span> 第一次出现都解释了；没有拿&quot;显然&quot;糊过去。\n<\/li><li>\n第 3 步明确承认&quot;需要一致收敛定理&quot;，并说明为什么逐项收敛不够——没有假装证完。\n<\/li><li>\n给了&quot;为什么这样设计&quot;：极限定义把&quot;复利增长 + 角度累加&quot;直接摆在几何上，这是幂级数定义看不出来的。\n<\/li><li>\n两个算例都能手算复核，其中一个专门展示&quot;慢收敛&quot;不是&quot;不收敛&quot;。\n<\/ul><\/div><\/details>", "c09": "<div class=\"source-badge\">📖 出处：复分析：可视化方法（中译本） · p.77<\/div><div class=\"prereq-bar\">⬅ 前置：<span class=\"prereq-hard\"><span class=\"prereq-tag\">必<\/span> <a href=\"#/concept/c08\">指数映射 e^z<\/a><\/span><\/div><h1>多值函数与支点<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、3、7、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>多值函数是一个 <span class=\"katex-inline\">z<\/span> 对应多个值的&quot;函数&quot;；支点是这样一个点：<span class=\"katex-inline\">z<\/span> 绕它走一圈回到原处时，函数值回不到原来的值。<\/p>\n<h2>为什么重要<\/h2>\n<p><span class=\"katex-inline\">\\sqrt[n]{z}<\/span>、<span class=\"katex-inline\">\\log z<\/span>、<span class=\"katex-inline\">z^\\alpha<\/span> 都是多值的。不理解支点，就没法理解为什么复积分要&quot;绕开&quot;某些点、为什么留数定理里&quot;绕一圈&quot;会多出一个 <span class=\"katex-inline\">2\\pi i<\/span>。第 7 章的环绕数、第 9 章的留数，都以支点为几何背景。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n    A[&quot;z 绕支点 0 一圈&quot;] --&gt; B[&quot;√z 值换一个&quot;]\n    B --&gt; C[&quot;绕两圈换第二个&quot;]\n    C --&gt; D[&quot;绕 n 圈回原值&quot;]\n    D --&gt; E[&quot;支点阶数 n-1&quot;]\n    F[&quot;log z&quot;] --&gt; G[&quot;绕多少圈都不回原值&lt;br/&gt;对数支点&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p><strong>看图说明<\/strong>：绕圈的次数决定落在哪个分支。有限阶支点会&quot;循环回来&quot;，对数支点永远回不来。<\/p>\n<h2>详解<\/h2>\n<h3>分数幂<\/h3>\n<div class=\"katex-block\">\\sqrt[n]{z}=\\sqrt[n]{r}\\,e^{i\\theta/n}.<\/div>\n<p><span class=\"katex-inline\">\\theta<\/span> 可以取 <span class=\"katex-inline\">\\theta+2m\\pi<\/span>，于是有 <span class=\"katex-inline\">n<\/span> 个值，角度相差 <span class=\"katex-inline\">2\\pi/n<\/span>。<\/p>\n<h3>支点的定义<\/h3>\n<p><span class=\"katex-inline\">q<\/span> 是 <span class=\"katex-inline\">f<\/span> 的支点，如果沿任意绕 <span class=\"katex-inline\">q<\/span> 一周的闭路走一圈，<span class=\"katex-inline\">f<\/span> 回不到原值。<span class=\"katex-inline\">\\sqrt[n]{z}<\/span> 的支点在 <span class=\"katex-inline\">0<\/span>：绕一圈，<span class=\"katex-inline\">\\theta/n<\/span> 增加 <span class=\"katex-inline\">2\\pi/n<\/span>，值换了分支；绕 <span class=\"katex-inline\">n<\/span> 圈才回来。所以 <span class=\"katex-inline\">0<\/span> 是 <span class=\"katex-inline\">n-1<\/span> 阶支点，一阶支点（<span class=\"katex-inline\">n=2<\/span>）叫简单支点。<\/p>\n<h3>单值支与剪开平面<\/h3>\n<p>从支点出发剪一条射线（例如负实轴），在剪开的区域里角度可以连续取定，<span class=\"katex-inline\">\\sqrt[n]{z}<\/span> 就分成 <span class=\"katex-inline\">n<\/span> 个单值函数。换路径但只要绕支点的圈数相同，值不变——这就是&quot;单值支&quot;的几何含义。<\/p>\n<h3>对数<\/h3>\n<div class=\"katex-block\">\\log z=\\ln r+i\\theta.<\/div>\n<p>绕原点一圈 <span class=\"katex-inline\">\\theta<\/span> 加 <span class=\"katex-inline\">2\\pi<\/span>，值永远回不到原处：<span class=\"katex-inline\">0<\/span> 是对数支点，无穷阶。剪开负实轴后得到主值支 <span class=\"katex-inline\">\\ln r+i\\arg z<\/span>（<span class=\"katex-inline\">\\arg\\in(-\\pi,\\pi]<\/span>）。<\/p>\n<h3>多值性的来源<\/h3>\n<p>一句话：<strong>角度的多值性<\/strong>。第 1 章说 <span class=\"katex-inline\">\\arg z<\/span> 可以差 <span class=\"katex-inline\">2\\pi<\/span> 整数倍，当时只是个记号问题；到了多值函数，它变成了&quot;绕几圈&quot;的几何问题。教材 2.6.1 把这条线索讲得很清楚。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为多值函数&quot;不是函数&quot;——实际上它是多值映射，剪开平面后每个分支都是正常函数。\n<\/li><li>\n别以为支点一定是 0——实际上 <span class=\"katex-inline\">\\sqrt{z-1}<\/span> 的支点在 1，<span class=\"katex-inline\">\\log(z^2+1)<\/span> 的支点在 <span class=\"katex-inline\">\\pm i<\/span>。\n<\/li><li>\n别以为绕支点一圈一定换值——实际上只有支点才换；绕非支点一圈会回到原值。\n<\/ul>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>多值函数与支点<\/td><td><span class=\"katex-inline\">\\sqrt[n]{z}<\/span> 的支点在 0，阶数 <span class=\"katex-inline\">n-1<\/span><\/td><\/tr><tr><td>第 3 章<\/td><td>反演与默比乌斯变换<\/td><td>分式线性映射把支点搬走<\/td><\/tr><tr><td>第 7 章<\/td><td>环绕数<\/td><td>绕支点的圈数是整数不变量<\/td><\/tr><tr><td>第 9 章<\/td><td>留数<\/td><td>绕奇点一圈贡献 <span class=\"katex-inline\">2\\pi i<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：<a href=\"#\" target=\"_blank\" rel=\"noopener\">指数映射<\/a>\n<\/li><li>\n后续：环绕数（第 7 章）\n<\/li><li>\n深度推导：见本页底部折叠片段\n<\/ul><details class=\"depth-fragment\"><summary>🔬 展开完整第一性原理推导（多值函数与支点）<\/summary><div class=\"depth-body\"><h1>深度推导：支点为什么让&quot;绕一圈回不到原值&quot;<\/h1>\n<p>前置清单：<\/p>\n<ol><li>\n<strong>极坐标<\/strong>：<span class=\"katex-inline\">z=re^{i\\theta}<\/span>，<span class=\"katex-inline\">r=|z|<\/span> 是长度，<span class=\"katex-inline\">\\theta=\\arg z<\/span> 是角度。\n<\/li><li>\n<strong>角度不唯一<\/strong>：<span class=\"katex-inline\">\\theta<\/span> 与 <span class=\"katex-inline\">\\theta+2\\pi<\/span> 表示同一个点；所以&quot;角度&quot;要沿路径<strong>连续地选<\/strong>，不能每点随便挑。\n<\/li><li>\n<strong>分数幂<\/strong>：<span class=\"katex-inline\">\\sqrt[n]{z}=\\sqrt[n]{r}\\,e^{i\\theta/n}<\/span>，其中 <span class=\"katex-inline\">\\sqrt[n]{r}<\/span> 是正的实数根，唯一。\n<\/li><li>\n<strong>闭路<\/strong>：从一点出发、连续走回同一点的路径；&quot;绕某点一圈&quot;指这条路径把该点套在里面。\n<\/ol>\n<h2>第 0 步：把&quot;回不到原值&quot;变成可计算的问题<\/h2>\n<p>取 <span class=\"katex-inline\">f(z)=\\sqrt[3]{z}<\/span>，起点 <span class=\"katex-inline\">p=re^{i\\varphi}\\ne0<\/span>。沿一条绕原点一圈的闭路走，回到 <span class=\"katex-inline\">p<\/span>。问 <span class=\"katex-inline\">f<\/span> 的值是否回到出发时的 <span class=\"katex-inline\">f(p)<\/span>。<\/p>\n<p>关键观察：<strong><span class=\"katex-inline\">f<\/span> 的值由 <span class=\"katex-inline\">\\theta<\/span> 决定，而 <span class=\"katex-inline\">\\theta<\/span> 沿路径连续变化<\/strong>。所以只要算出 <span class=\"katex-inline\">\\theta<\/span> 走完一圈后的净变化，就能算出 <span class=\"katex-inline\">f<\/span> 的净变化。<\/p>\n<h2>第 1 步：绕原点一圈，角度净增加 <span class=\"katex-inline\">2\\pi<\/span><\/h2>\n<p>沿闭路走一圈回到 <span class=\"katex-inline\">p<\/span>，长度 <span class=\"katex-inline\">r<\/span> 回到原值。角度呢？路径把原点套在里面，角度必须连续地转过一整圈才能回到原来的方向。所以<\/p>\n<div class=\"katex-block\">\\theta_{\\text{终}}=\\varphi+2\\pi.<\/div>\n<p>这里的 <span class=\"katex-inline\">2\\pi<\/span> 不是可以随便加减的&quot;多值选择&quot;，而是路径的几何事实：你确实多绕了一整圈。若路径不套住原点，净变化就是 0。<\/p>\n<h2>第 2 步：<span class=\"katex-inline\">f<\/span> 的角度只走了 <span class=\"katex-inline\">1/3<\/span> 圈<\/h2>\n<div class=\"katex-block\">\\sqrt[3]{z}=\\sqrt[3]{r}\\,e^{i\\theta/3}.<\/div>\n<p><span class=\"katex-inline\">\\theta<\/span> 从 <span class=\"katex-inline\">\\varphi<\/span> 连续变到 <span class=\"katex-inline\">\\varphi+2\\pi<\/span>，所以 <span class=\"katex-inline\">f<\/span> 的角度从 <span class=\"katex-inline\">\\varphi/3<\/span> 连续变到<\/p>\n<div class=\"katex-block\">\\frac{\\varphi+2\\pi}{3}=\\frac{\\varphi}{3}+\\frac{2\\pi}{3}.<\/div>\n<p>终点与起点的角度差是 <span class=\"katex-inline\">\\frac{2\\pi}{3}<\/span>。两个复数相等要求角度差是 <span class=\"katex-inline\">2\\pi<\/span> 的整数倍；<span class=\"katex-inline\">\\frac{2\\pi}{3}<\/span> 不是，所以<strong>值变了<\/strong>。<\/p>\n<p>具体变成了哪个值？角度多了 <span class=\"katex-inline\">2\\pi/3<\/span>，正是 <span class=\"katex-inline\">\\sqrt[3]{p}<\/span> 的另一个分支（三个立方根在角度上相差 <span class=\"katex-inline\">120°<\/span>）。<\/p>\n<h2>第 3 步：绕几圈才回来<\/h2>\n<p>每绕一圈，<span class=\"katex-inline\">f<\/span> 的角度增加 <span class=\"katex-inline\">\\frac{2\\pi}{3}<\/span>。<\/p>\n<ul><li>\n一圈：差 <span class=\"katex-inline\">\\frac{2\\pi}{3}<\/span>，不回来；\n<\/li><li>\n两圈：差 <span class=\"katex-inline\">\\frac{4\\pi}{3}<\/span>，不回来；\n<\/li><li>\n三圈：差 <span class=\"katex-inline\">2\\pi<\/span>，回来了。\n<\/ul>\n<p>所以绕三圈第一次回到原值。按教材定义，<span class=\"katex-inline\">q<\/span> 叫 <span class=\"katex-inline\">(N-1)<\/span> 阶支点，其中 <span class=\"katex-inline\">N<\/span> 是第一次回到原值所需的圈数；这里 <span class=\"katex-inline\">N=3<\/span>，阶数 <span class=\"katex-inline\">2<\/span>。<\/p>\n<p>一般地 <span class=\"katex-inline\">z^{1/n}<\/span>：每圈角度增加 <span class=\"katex-inline\">\\frac{2\\pi}{n}<\/span>，<span class=\"katex-inline\">n<\/span> 圈凑够 <span class=\"katex-inline\">2\\pi<\/span>，阶数 <span class=\"katex-inline\">n-1<\/span>。<span class=\"katex-inline\">n=2<\/span> 时阶数 1，叫简单支点。<\/p>\n<h2>第 4 步：为什么只有被套住的点才算支点<\/h2>\n<p>取 <span class=\"katex-inline\">q\\ne0<\/span>，让 <span class=\"katex-inline\">z<\/span> 绕 <span class=\"katex-inline\">q<\/span> 走一圈。这时 <span class=\"katex-inline\">z<\/span> 相对原点的角度净变化是多少？<\/p>\n<p>把路径想象成一根绳圈：如果圈里没有原点，绳子可以连续缩成一个点而不扫过原点，角度累计为 0。既然净变化是 0，<span class=\"katex-inline\">\\theta<\/span> 回到 <span class=\"katex-inline\">\\varphi<\/span>，<span class=\"katex-inline\">f<\/span> 也就回到原值。所以 <span class=\"katex-inline\">q\\ne0<\/span> 不是 <span class=\"katex-inline\">\\sqrt[3]{z}<\/span> 的支点。<\/p>\n<p><strong>支点的位置由&quot;哪些点被路径套住会改变角度累计&quot;决定<\/strong>，不是由函数表达式里哪个字母好看决定。这也解释了为什么 <span class=\"katex-inline\">\\sqrt{z-1}<\/span> 的支点在 <span class=\"katex-inline\">1<\/span>：把 <span class=\"katex-inline\">z-1<\/span> 看成新变量，它的支点在&quot;新变量的原点&quot;，也就是 <span class=\"katex-inline\">z=1<\/span>。<\/p>\n<h2>第 5 步：对数为什么是无穷阶<\/h2>\n<div class=\"katex-block\">\\log z=\\ln r+i\\theta.<\/div>\n<p>绕原点一圈，<span class=\"katex-inline\">\\theta<\/span> 增加 <span class=\"katex-inline\">2\\pi<\/span>，值增加 <span class=\"katex-inline\">2\\pi i<\/span>：<\/p>\n<div class=\"katex-block\">\\log z\\ \\longrightarrow\\ \\log z+2\\pi i.<\/div>\n<p>再绕一圈加 <span class=\"katex-inline\">4\\pi i<\/span>，绕 <span class=\"katex-inline\">k<\/span> 圈加 <span class=\"katex-inline\">2k\\pi i<\/span>。这些值互不相等，永远回不到出发点那个值。所以 <span class=\"katex-inline\">0<\/span> 是对数支点，没有有限阶数（教材叫&quot;对数支点&quot;）。<\/p>\n<p>这也说明 <span class=\"katex-inline\">\\log<\/span> 的多值性是&quot;无穷多值&quot;，比 <span class=\"katex-inline\">\\sqrt[n]{z}<\/span> 的 <span class=\"katex-inline\">n<\/span> 值更严重。<\/p>\n<h2>第 6 步：剪开平面为什么就单值了<\/h2>\n<p>从原点沿负实轴剪一刀，剩下的区域里，任何闭路都不能套住原点（一绕就会跨过剪口）。于是角度可以连续地、唯一地选在一个范围里，例如 <span class=\"katex-inline\">-\\pi&lt;\\theta\\le\\pi<\/span>。取定这个范围后：<\/p>\n<div class=\"katex-block\">\\sqrt[3]{z}=\\sqrt[3]{r}\\,e^{i\\theta/3},\\qquad \\log z=\\ln r+i\\theta<\/div>\n<p>都成了单值函数。这就是&quot;单值支&quot;的来历。剪口的位置可以换（沿正实轴、沿任意射线），换一条剪口只是换了一组单值支的选取方式。<\/p>\n<h2>数值算例一：<span class=\"katex-inline\">\\sqrt[3]{1}<\/span> 绕原点一圈<\/h2>\n<p>起点 <span class=\"katex-inline\">1<\/span>，<span class=\"katex-inline\">\\sqrt[3]{1}=1<\/span>。<\/p>\n<p>绕一圈后，角度累计 <span class=\"katex-inline\">2\\pi<\/span>，取 <span class=\"katex-inline\">e^{i2\\pi/3}=-\\frac12+i\\frac{\\sqrt3}{2}\\approx-0.5+0.866i<\/span>。 绕两圈：<span class=\"katex-inline\">e^{i4\\pi/3}=-\\frac12-i\\frac{\\sqrt3}{2}\\approx-0.5-0.866i<\/span>。 绕三圈：<span class=\"katex-inline\">e^{i2\\pi}=1<\/span>，回来。<\/p>\n<p>三个值正好是单位圆内接正三角形的顶点，与第 1 章&quot;<span class=\"katex-inline\">z^3=1<\/span> 的三个根&quot;完全一致——这不是巧合，<span class=\"katex-inline\">\\sqrt[3]{1}<\/span> 的三个值就是那三个根。<\/p>\n<h2>数值算例二：<span class=\"katex-inline\">\\sqrt{z-1}<\/span> 的支点在 1<\/h2>\n<p>取 <span class=\"katex-inline\">p=2<\/span>，<span class=\"katex-inline\">\\sqrt{p-1}=1<\/span>。让 <span class=\"katex-inline\">z<\/span> 绕 <span class=\"katex-inline\">1<\/span> 走一圈（例如以 <span class=\"katex-inline\">1<\/span> 为心、半径 1 的圆），回到 <span class=\"katex-inline\">2<\/span>。此时 <span class=\"katex-inline\">z-1<\/span> 绕自己的原点一圈，角度净增 <span class=\"katex-inline\">2\\pi<\/span>，<span class=\"katex-inline\">\\sqrt{z-1}<\/span> 的角度净增 <span class=\"katex-inline\">\\pi<\/span>，值变成 <span class=\"katex-inline\">-1<\/span>。绕第二圈才回到 <span class=\"katex-inline\">1<\/span>。<\/p>\n<p>若改让 <span class=\"katex-inline\">z<\/span> 绕 <span class=\"katex-inline\">0<\/span> 走一圈，<span class=\"katex-inline\">z-1<\/span> 的路径不套住 <span class=\"katex-inline\">1<\/span>，角度净变化为 0，<span class=\"katex-inline\">\\sqrt{z-1}<\/span> 回到原值。这验证了第 4 步：支点只看&quot;谁被套住&quot;。<\/p>\n<h2>反例：用主值定义 <span class=\"katex-inline\">\\sqrt{z}<\/span> 会在负实轴上跳变<\/h2>\n<p>规定 <span class=\"katex-inline\">\\sqrt{z}<\/span> 取角度在 <span class=\"katex-inline\">(-\\pi/2,\\pi/2]<\/span> 的那个值（主值）。在负实轴上方趋近 <span class=\"katex-inline\">z=-1<\/span>：角度趋近 <span class=\"katex-inline\">\\pi<\/span>，<span class=\"katex-inline\">\\sqrt{z}\\to i<\/span>。在下方趋近：角度趋近 <span class=\"katex-inline\">-\\pi<\/span>，<span class=\"katex-inline\">\\sqrt{z}\\to-i<\/span>。同一个点两侧的极限不同，函数在这里<strong>不连续<\/strong>。<\/p>\n<p>这不是&quot;定义得不好&quot;，而是多值性无法用一条连续曲线同时装下两个分支的必然结果。剪开平面（去掉负实轴）后，每个分支各自连续；想在整个平面上谈 <span class=\"katex-inline\">\\sqrt{z}<\/span>，就只能接受它多值。<\/p>\n<h2>与后面章节的连接<\/h2>\n<ul><li>\n第 2 章：<span class=\"katex-inline\">z^{1/n}<\/span> 是&quot;反演 <span class=\"katex-inline\">z^n<\/span>&quot;的必然结果，<span class=\"katex-inline\">n<\/span> 值性来自角度除以 <span class=\"katex-inline\">n<\/span>。\n<\/li><li>\n第 7 章：环绕数把&quot;绕几圈&quot;变成一个整数指标；支点附近绕一圈的积分会多出 <span class=\"katex-inline\">2\\pi i<\/span> 的倍数，正是环绕数的算术化。\n<\/li><li>\n第 9 章：留数定理里&quot;绕奇点一圈贡献 <span class=\"katex-inline\">2\\pi i<\/span>&quot;与这里的&quot;绕支点一圈换分支&quot;是同一件事的两种表现。\n<\/li><li>\n第 12 章：黎曼曲面把多值函数铺成一层层曲面，支点就是层与层交汇的&quot;铰链&quot;。\n<\/ul>\n<h2>差生通读自查<\/h2>\n<ul><li>\n极坐标、角度连续选取、闭路三个前置都给了白话；<span class=\"katex-inline\">\\theta<\/span>、<span class=\"katex-inline\">\\varphi<\/span>、<span class=\"katex-inline\">N<\/span> 第一次出现都说明了。\n<\/li><li>\n每一步都能自己算：角度净增 <span class=\"katex-inline\">2\\pi<\/span>、除以 3、判断是否为 <span class=\"katex-inline\">2\\pi<\/span> 整数倍。\n<\/li><li>\n给了&quot;为什么这样设计&quot;：支点不是人为规定，而是&quot;角度累计量无法抹掉&quot;的几何后果；剪开平面是为了让角度可以唯一选。\n<\/li><li>\n两个算例一个验 <span class=\"katex-inline\">n<\/span> 圈循环，一个验&quot;支点位置由被套住的点决定&quot;，并给了主值不连续的反例。\n<\/ul><\/div><\/details>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：几何和复算术<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：几何和复算术<\/a><br>检查点：第 1 章自测题正确率 ≥ 80%<\/li><li class='path-step' id='path-02'><strong>步骤 02：作为变换看的复函数<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：作为变换看的复函数<\/a><br>检查点：第 2 章自测题正确率 ≥ 80%<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__graph__": "<h1>🕸 知识图谱<\/h1><p>节点是概念，边是先修关系。拖拽节点、滚轮缩放，点击节点跳转到对应概念页。<\/p><div id=\"graph-container\" style=\"height:520px;border:1px solid var(--border);border-radius:10px;background:var(--panel)\"><\/div><p class=\"sub\">红线 = 必学前置 · 灰线 = 建议先看 · 蓝线 = 拓展阅读<\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：几何和复算术<\/h1><div class='quiz-item' data-qid='q01' data-type='single' data-concept='c01' data-chapter='ch01'><p class='quiz-q'><b>Q1.<\/b> <span class=\"katex-inline\">(1+i)^4<\/span> 等于多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 4<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> -4<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 4i<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> -4i<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q2.<\/b> 乘以 <span class=\"katex-inline\">i<\/span> 对平面上每个非零向量的作用是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 放大一倍<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 逆时针转 90°<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 关于实轴反射<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 取倒数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single' data-concept='c04' data-chapter='ch01'><p class='quiz-q'><b>Q3.<\/b> <span class=\"katex-inline\">z^5=1<\/span> 的五个根在复平面上构成什么图形？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 一条直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 内接正五边形<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 圆内随机五点<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 两条相交直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='multi' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q4.<\/b> 下面哪些命题等价于 <span class=\"katex-inline\">B=iA<\/span>？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q04' value='0'> <span class=\"katex-inline\">B<\/span> 由 <span class=\"katex-inline\">A<\/span> 逆时针转 90° 得到<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='1'> <span class=\"katex-inline\">B<\/span> 与 <span class=\"katex-inline\">A<\/span> 垂直且等长<\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='2'> <span class=\"katex-inline\">A+iB=0<\/span><\/label><label class='quiz-opt'><input type='checkbox' name='q04' value='3'> <span class=\"katex-inline\">B<\/span> 是 <span class=\"katex-inline\">A<\/span> 的复共轭<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q05' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q5.<\/b> <span class=\"katex-inline\">\\cos^4\\theta<\/span> 用倍角表示是哪一个？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> <span class=\"katex-inline\">\\frac12(\\cos2\\theta+1)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> <span class=\"katex-inline\">\\frac18(\\cos4\\theta+4\\cos2\\theta+3)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> <span class=\"katex-inline\">\\frac14(\\cos4\\theta+3)<\/span><\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> <span class=\"katex-inline\">\\frac12(\\cos4\\theta+\\cos2\\theta)<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single' data-concept='c03' data-chapter='ch01'><p class='quiz-q'><b>Q6.<\/b> <span class=\"katex-inline\">\\left|e^{i\\theta}\\right|<\/span> 等于多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> <span class=\"katex-inline\">\\theta<\/span><\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 1<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> <span class=\"katex-inline\">\\cos\\theta<\/span><\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 随 θ 变化<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single' data-concept='c05' data-chapter='ch01'><p class='quiz-q'><b>Q7.<\/b> <span class=\"katex-inline\">\\bar ab<\/span> 的实部对应哪一种向量运算？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 叉乘<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 点乘<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 加法<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 模长之比<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q8.<\/b> 证明“四边形四边作正方形、对边中心连线垂直等长”时，封口条件 <span class=\"katex-inline\">a+b+c+d=0<\/span> 起了什么作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q08' value='0'> 保证四边形是凸的<\/label><label class='quiz-opt'><input type='radio' name='q08' value='1'> 让 <span class=\"katex-inline\">A+iB<\/span> 的实部与虚部同时归零<\/label><label class='quiz-opt'><input type='radio' name='q08' value='2'> 保证正方形不自交<\/label><label class='quiz-opt'><input type='radio' name='q08' value='3'> 让两条连线平行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q9.<\/b> 每个保向运动都可以写成什么形式？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> <span class=\"katex-inline\">M(z)=\\bar z+v<\/span><\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> <span class=\"katex-inline\">M(z)=e^{i\\theta}z+v<\/span><\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> <span class=\"katex-inline\">M(z)=z^2+v<\/span><\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> <span class=\"katex-inline\">M(z)=e^{i\\theta}\\bar z+v<\/span><\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single' data-concept='c02' data-chapter='ch01'><p class='quiz-q'><b>Q10.<\/b> 两条相交直线 <span class=\"katex-inline\">L_1,L_2<\/span> 交于 <span class=\"katex-inline\">O<\/span>、夹角 <span class=\"katex-inline\">\\varphi<\/span>，连续做两次反射 <span class=\"katex-inline\">\\mathcal R_{L_2}\\circ\\mathcal R_{L_1}<\/span> 的结果是什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 平移 <span class=\"katex-inline\">2V<\/span><\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 绕 <span class=\"katex-inline\">O<\/span> 转 <span class=\"katex-inline\">2\\varphi<\/span><\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 关于 O 的中心对称<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 恒等变换<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：作为变换看的复函数<\/h1><div class='quiz-item' data-qid='q11' data-type='single' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q1.<\/b> <span class=\"katex-inline\">w=z^3<\/span> 把张角 <span class=\"katex-inline\">30°<\/span> 的角形区域映成多大的角？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 10°<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 30°<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 90°<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 120°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q2.<\/b> <span class=\"katex-inline\">z^4=16<\/span> 的解在复平面上构成什么图形？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 半径 2 的正方形四个顶点<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 半径 4 的正方形<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 半径 2 的圆上任意四点<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 一条直线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q13' data-type='single' data-concept='c07' data-chapter='ch02'><p class='quiz-q'><b>Q3.<\/b> 幂级数在 <span class=\"katex-inline\">z=a<\/span> 处收敛，可以推出什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 在全平面收敛<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 在 <span class=\"katex-inline\">|z|&lt;|a|<\/span> 内绝对收敛<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 在 <span class=\"katex-inline\">|z|=|a|<\/span> 上收敛<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 在 <span class=\"katex-inline\">|z|&gt;|a|<\/span> 发散<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='multi' data-concept='c08' data-chapter='ch02'><p class='quiz-q'><b>Q4.<\/b> 下面哪些是 <span class=\"katex-inline\">e^z<\/span> 的几何事实？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q14' value='0'> 周期为 <span class=\"katex-inline\">2\\pi i<\/span><\/label><label class='quiz-opt'><input type='checkbox' name='q14' value='1'> 把高度 <span class=\"katex-inline\">2\\pi<\/span> 的水平带铺满全平面（去掉 0）<\/label><label class='quiz-opt'><input type='checkbox' name='q14' value='2'> 把虚轴映成单位圆<\/label><label class='quiz-opt'><input type='checkbox' name='q14' value='3'> 是一对一映射<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single' data-concept='c09' data-chapter='ch02'><p class='quiz-q'><b>Q5.<\/b> <span class=\"katex-inline\">\\sqrt[3]{z}<\/span> 的支点在哪，阶数是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> <span class=\"katex-inline\">z=1<\/span>，一阶<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> <span class=\"katex-inline\">z=0<\/span>，二阶<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> <span class=\"katex-inline\">z=0<\/span>，一阶<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 没有支点<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q16' data-type='single' data-concept='c06' data-chapter='ch02'><p class='quiz-q'><b>Q6.<\/b> <span class=\"katex-inline\">z^3=c<\/span> 的三个解，相邻两个相差多少角度？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 60°<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 90°<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 120°<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 180°<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single' data-concept='c07' data-chapter='ch02'><p class='quiz-q'><b>Q7.<\/b> 为什么 <span class=\"katex-inline\">e^z<\/span> 的收敛半径是无穷，而 <span class=\"katex-inline\">\\frac{1}{1-z}<\/span> 的幂级数只有半径 1？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> <span class=\"katex-inline\">e^z<\/span> 的系数 <span class=\"katex-inline\">1/n!<\/span> 衰减极快<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> <span class=\"katex-inline\">\\frac{1}{1-z}<\/span> 的系数全是 1，<span class=\"katex-inline\">|z|\\ge1<\/span> 时通项不趋于零<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> <span class=\"katex-inline\">e^z<\/span> 不是幂级数<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 两者半径其实一样<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='single' data-concept='c09' data-chapter='ch02'><p class='quiz-q'><b>Q8.<\/b> <span class=\"katex-inline\">z<\/span> 绕原点一圈回到原处，<span class=\"katex-inline\">\\sqrt[3]{z}<\/span> 的值会怎样？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q18' value='0'> 回到原值<\/label><label class='quiz-opt'><input type='radio' name='q18' value='1'> 变成另一个立方根<\/label><label class='quiz-opt'><input type='radio' name='q18' value='2'> 变为原来的一半<\/label><label class='quiz-opt'><input type='radio' name='q18' value='3'> 趋于无穷<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q19' data-type='single' data-concept='c08' data-chapter='ch02'><p class='quiz-q'><b>Q9.<\/b> <span class=\"katex-inline\">e^z<\/span> 的周期是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> <span class=\"katex-inline\">2\\pi<\/span><\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> <span class=\"katex-inline\">\\pi i<\/span><\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> <span class=\"katex-inline\">2\\pi i<\/span><\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 没有周期<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='复平面'>复平面 — 用平面上的点表示复数的坐标系，横轴实轴、纵轴虚轴 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='模'>模 — 复数对应箭头的长度，记 |z| <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='辐角'>辐角 — 箭头与正实轴的夹角，记 arg z，可差 2π 的整数倍 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='复共轭'>复共轭 — 关于实轴的镜像，记 z 上加横线；z z̄ = |z|² <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='极坐标记法'>极坐标记法 — z = r∠θ，r 是长度、θ 是角度 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='欧拉公式'>欧拉公式 — e^(iθ) = cosθ + i sinθ，即单位圆上的角度标记 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='单位根'>单位根 — zⁿ = 1 的 n 个解，均匀分布在单位圆上 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='有符号面积'>有符号面积 — 叉乘在平面上的定义，逆时针为正、顺时针为负 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='运动'>运动 — 平面到自身、保持任意两点距离不变的映射 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='保向 / 反向'>保向 / 反向 — 保持角度定向的变换（平移、旋转）/ 翻转定向的变换（反射） <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='群'>群 — 含恒等、有逆、对复合封闭的变换族 <span class=glossary-ref>（第 1 章：几何和复算术）<\/span><\/li><li data-term='象平面'>象平面 — 复函数把 z 平面上的点搬到 w 平面，w 平面即象平面 <span class=glossary-ref>（第 2 章：作为变换看的复函数）<\/span><\/li><li data-term='收敛圆'>收敛圆 — 幂级数在 |z|&lt;ρ 内收敛、|z|&gt;ρ 外发散的圆盘边界 <span class=glossary-ref>（第 2 章：作为变换看的复函数）<\/span><\/li><li data-term='绝对收敛'>绝对收敛 — 各项的模构成的级数收敛，是比收敛更强的要求 <span class=glossary-ref>（第 2 章：作为变换看的复函数）<\/span><\/li><li data-term='支点'>支点 — z 绕它一圈回到原处时，多值函数回不到原值的点 <span class=glossary-ref>（第 2 章：作为变换看的复函数）<\/span><\/li><li data-term='单值支'>单值支 — 沿支点剪开平面后，多值函数分出的每个单值分支 <span class=glossary-ref>（第 2 章：作为变换看的复函数）<\/span><\/li><li data-term='对数支点'>对数支点 — 绕任意多圈都回不到原值的支点，如 log z 的 0 <span class=glossary-ref>（第 2 章：作为变换看的复函数）<\/span><\/li><\/ul>", "__diagnosis__": "<h1>🩺 诊断测试<\/h1><p>系统会从全书中抽题。答错的题会自动沿知识依赖链回溯，告诉你真正需要补的前置知识点。<\/p><div class='diag-controls'><button id='diag-start'>开始诊断（随机抽 5 题）<\/button><span id='diag-progress'><\/span><\/div><div id='diag-stage'><\/div><div id='diag-result'><\/div>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：把几何命题翻译成复等式<\/h2>\n<p>教材全书的固定套路，遇到&quot;垂直且等长&quot;&quot;共线&quot;&quot;三点共圆&quot;这类话，按四步走：<\/p>\n<ol><li>\n<strong>选原点，把关键点写成复数。<\/strong> 通常选一个顶点或图形的中心，让尽量多的点坐标变简单。\n<\/li><li>\n<strong>把边或位移写成复数。<\/strong> 每条带方向的边就是一个复数，长度是模，方向是辐角。\n<\/li><li>\n<strong>把结论翻译成一个方程。<\/strong> &quot;垂直&quot; = 乘以 <span class=\"katex-inline\">i<\/span>；&quot;等长&quot; = 模相等；两者合起来 = <span class=\"katex-inline\">B=iA<\/span> 或 <span class=\"katex-inline\">A+iB=0<\/span>。\n<\/li><li>\n<strong>用已知条件（通常是封口条件 <span class=\"katex-inline\">\\sum=0<\/span>）算完。<\/strong>\n<\/ol>\n<p>判断标准：如果算到最后所有项自动抵消，说明翻译对了；如果剩下一个解不掉的式子，多半是第 1 步的原点选错了。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n<strong>要算长度、角度、乘除<\/strong> → 换极坐标 <span class=\"katex-inline\">r\\angle\\theta<\/span> 或 <span class=\"katex-inline\">re^{i\\theta}<\/span>。\n<\/li><li>\n<strong>要算加法、平移<\/strong> → 用笛卡儿坐标 <span class=\"katex-inline\">x+iy<\/span>。\n<\/li><li>\n<strong>看到&quot;转 <span class=\"katex-inline\">90°<\/span>&quot;<\/strong> → 直接乘 <span class=\"katex-inline\">i<\/span>，别写旋转矩阵。\n<\/li><li>\n<strong>看到&quot;两个旋转复合&quot;<\/strong> → 写成 <span class=\"katex-inline\">e^{i\\theta}z+v<\/span> 的形式，角度直接相加；若总角度是 <span class=\"katex-inline\">2\\pi<\/span> 整数倍，结果是平移。\n<\/li><li>\n<strong>看到 <span class=\"katex-inline\">x^n-1<\/span>、<span class=\"katex-inline\">x^n+1<\/span> 的因式分解<\/strong> → 先画单位根，共轭配对。\n<\/li><li>\n<strong>看到点乘叉乘<\/strong> → 写成 <span class=\"katex-inline\">\\bar ab<\/span>，实部虚部各取所需。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>把复数当两个实数分开处理。<\/strong> 一旦拆成 <span class=\"katex-inline\">a<\/span> 和 <span class=\"katex-inline\">b<\/span> 分别算，乘法法则就变成一堆看不出意义的交叉项。教材反复强调&quot;复数是不可分的整体&quot;。\n<\/li><li>\n<strong>用三角恒等式去证复数的几何性质。<\/strong> 教材 p.8 脚注直接点名批评这种做法：那些恒等式本身只是乘法法则的复杂化表现。\n<\/li><li>\n<strong>把 <span class=\"katex-inline\">e^{i\\theta}=\\cos\\theta+i\\sin\\theta<\/span> 当成定义。<\/strong> 这样等于放弃解释，后面遇到 <span class=\"katex-inline\">e^z<\/span> 的映射性质就接不上。\n<\/li><li>\n<strong>忽略辐角的多值性。<\/strong> 在需要判断&quot;绕了几圈&quot;的时候（第 7 章），直接把 <span class=\"katex-inline\">\\arg<\/span> 当单值函数会得出错误结论。\n<\/li><li>\n<strong>把叉乘当成三维专属。<\/strong> 平面上它是有符号面积，本书的积分公式全靠这个符号。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>第 1 章：几何和复算术<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>模与共轭<\/td><td>$\\<\/td><td>z\\<\/td><td>=\\sqrt{a^2+b^2}<span class=\"katex-inline\">，<\/span>\\bar z=a-ib<span class=\"katex-inline\">，<\/span>z\\bar z=\\<\/td><td>z\\<\/td><td>^2$<\/td><\/tr><tr><td>实部虚部<\/td><td><span class=\"katex-inline\">\\operatorname{Re}z=\\frac{z+\\bar z}{2}<\/span>，<span class=\"katex-inline\">\\operatorname{Im}z=\\frac{z-\\bar z}{2i}<\/span><\/td><\/tr><tr><td>极坐标<\/td><td><span class=\"katex-inline\">z=r\\angle\\theta=re^{i\\theta}<\/span>，<span class=\"katex-inline\">\\theta<\/span> 可差 <span class=\"katex-inline\">2k\\pi<\/span><\/td><\/tr><tr><td>加法<\/td><td><span class=\"katex-inline\">(a+ib)+(c+id)=(a+c)+i(b+d)<\/span>，平行四边形法则<\/td><\/tr><tr><td>乘法（几何）<\/td><td>长度相乘，角度相加<\/td><\/tr><tr><td>乘法（代数）<\/td><td><span class=\"katex-inline\">(a+ib)(c+id)=(ac-bd)+i(ad+bc)<\/span><\/td><\/tr><tr><td>除以复数<\/td><td>$\\frac{1}{z}=\\frac{\\bar z}{\\<\/td><td>z\\<\/td><td>^2}<span class=\"katex-inline\">，<\/span>\\frac{z_1}{z_2}=\\frac{z_1\\bar z_2}{\\<\/td><td>z_2\\<\/td><td>^2}$<\/td><\/tr><tr><td>乘以 <span class=\"katex-inline\">A<\/span> 的几何意义<\/td><td>绕原点转 <span class=\"katex-inline\">\\arg A<\/span>，放大 $\\<\/td><td>A\\<\/td><td>$ 倍<\/td><\/tr><tr><td>欧拉公式<\/td><td><span class=\"katex-inline\">e^{i\\theta}=\\cos\\theta+i\\sin\\theta<\/span>，$\\<\/td><td>e^{i\\theta}\\<\/td><td>=1$<\/td><\/tr><tr><td>三角反解<\/td><td><span class=\"katex-inline\">\\cos\\theta=\\frac{e^{i\\theta}+e^{-i\\theta}}{2}<\/span>，<span class=\"katex-inline\">\\sin\\theta=\\frac{e^{i\\theta}-e^{-i\\theta}}{2i}<\/span><\/td><\/tr><tr><td>倍角<\/td><td><span class=\"katex-inline\">\\cos4\\theta<\/span> 类问题：把 <span class=\"katex-inline\">2\\cos\\theta=e^{i\\theta}+e^{-i\\theta}<\/span> 展开配对<\/td><\/tr><tr><td>单位根<\/td><td><span class=\"katex-inline\">z^n=1<\/span> 的根 <span class=\"katex-inline\">e^{ik2\\pi/n}<\/span>，<span class=\"katex-inline\">k=0,\\dots,n-1<\/span><\/td><\/tr><tr><td>因式分解<\/td><td><span class=\"katex-inline\">z^n-1=\\prod_{k}(z-e^{ik2\\pi/n})<\/span>；共轭配对得 <span class=\"katex-inline\">z^2-2z\\cos\\frac{2k\\pi}{n}+1<\/span><\/td><\/tr><tr><td>点乘叉乘<\/td><td><span class=\"katex-inline\">\\bar ab=\\mathbf a\\cdot\\mathbf b+i(\\mathbf a\\times\\mathbf b)<\/span><\/td><\/tr><tr><td>多边形面积<\/td><td><span class=\"katex-inline\">A=\\frac12\\operatorname{Im}(\\bar ab+\\bar bc+\\cdots)<\/span>，顶点逆时针<\/td><\/tr><tr><td>保向运动<\/td><td><span class=\"katex-inline\">M(z)=e^{i\\theta}z+v<\/span>；反射复合两次 = 旋转 <span class=\"katex-inline\">2\\varphi<\/span><\/td><\/tr><\/tbody><\/table>\n<h2>常用数值<\/h2>\n<table><thead><tr><th>量<\/th><th>值<\/th><\/tr><\/thead><tbody><tr><td><span class=\"katex-inline\">i<\/span> 的模与辐角<\/td><td><span class=\"katex-inline\">1<\/span>，<span class=\"katex-inline\">\\pi/2<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">(1+i)<\/span><\/td><td><span class=\"katex-inline\">\\sqrt2\\angle\\pi/4<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">(1+i)^4<\/span><\/td><td><span class=\"katex-inline\">-4<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">(2+i)^3<\/span><\/td><td><span class=\"katex-inline\">2+11i<\/span><\/td><\/tr><tr><td><span class=\"katex-inline\">i^2<\/span><\/td><td><span class=\"katex-inline\">-1<\/span><\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{}, mastery: store.get('mastery')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
